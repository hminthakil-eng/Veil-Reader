name: Station 3D - Dependency Isolation Gate

on:
  pull_request:
    branches:
      - design/victorian-station-scene-architecture-20261017
    paths:
      - 'app/**'
      - 'docs/design/STATION_3D_GATE_PLAN_20261017.md'
      - '.github/workflows/station3d-isolation-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: station3d-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-only-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Pin and inspect debug / release runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/station3d
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon --console=plain > build/reports/station3d/debugRuntimeClasspath.txt
          gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon --console=plain > build/reports/station3d/releaseRuntimeClasspath.txt
          grep -E 'io.github.sceneview:sceneview:4.56.0' build/reports/station3d/debugRuntimeClasspath.txt
          if grep -F 'org.jetbrains.kotlin:kotlin-android-extensions-runtime' build/reports/station3d/debugRuntimeClasspath.txt; then
            echo 'FAIL: deprecated Fuel/Parcel runtime conflicts with supported Kotlin parcelize'
            exit 1
          fi
          if grep -iE 'io[.]github[.]sceneview|com[.]google[.]android[.]filament' build/reports/station3d/releaseRuntimeClasspath.txt; then
            echo 'FAIL: scene engine accidentally entered release classpath'
            exit 1
          fi
          echo 'PASS: SceneView exists in debug only, absent from release dependency graph'

      - name: Compile debug and release source (no signing / no release)
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:compileDebugKotlin :app:compileReleaseKotlin --no-daemon --max-workers=2 --stacktrace --console=plain

      - name: Validate original glTF geometry and local provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/station3d/validate_station_gltf.py

      - name: Run original station policies and retained 2.5D UI tests
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest \
            --tests 'com.veilreader.app.ui.station.*' \
            --tests 'com.veilreader.app.ui.screens.RebornThresholdScreenTest' \
            --no-daemon --max-workers=2 --stacktrace --console=plain

      - name: Create ephemeral QA signing material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .forge-qa
          keytool -genkeypair -keystore .forge-qa/debug.keystore \
            -alias AndroidDebugKey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Veil Station 3D Lab,OU=Test Build,O=Eyad Studio,C=US' -noprompt

      - name: Assemble separately installable 3D lab QA APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug \
            -PveilForgeQa=true -PveilRebornThreshold=true -PveilVictorianStation=true \
            -PveilStation3dLab=true -PveilForgeRevision="${GITHUB_SHA}" \
            --no-daemon --max-workers=2 --stacktrace --console=plain
          stat -c '%n %s bytes' app/build/outputs/apk/debug/app-debug.apk
          grep -F 'com.veilreader.app.station3dqa' app/build/outputs/apk/debug/output-metadata.json
          echo 'Verified separate 3D QA install identity'

      - name: Preserve dependency, manifest, tests and QA APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: station3d-lab-qa-NOT-RELEASE
          path: |
            build/reports/station3d/*.txt
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/outputs/logs/manifest-merger-debug-report.txt
          if-no-files-found: ignore
          retention-days: 7
