name: Station 3D - Dependency Isolation Gate

on:
  pull_request:
    branches:
      - design/victorian-station-scene-architecture-20261017
    paths:
      - 'app/**'
      - 'docs/design/STATION_3D_GATE_PLAN_20261017.md'
      - '.github/workflows/station3d-isolation-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: station3d-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-only-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Pin and inspect debug / release runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/station3d
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon --console=plain > build/reports/station3d/debugRuntimeClasspath.txt
          gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon --console=plain > build/reports/station3d/releaseRuntimeClasspath.txt
          grep -E 'io.github.sceneview:sceneview:4.56.0' build/reports/station3d/debugRuntimeClasspath.txt
          if grep -iE 'io[.]github[.]sceneview|com[.]google[.]android[.]filament' build/reports/station3d/releaseRuntimeClasspath.txt; then
            echo 'FAIL: scene engine accidentally entered release classpath'
            exit 1
          fi
          echo 'PASS: SceneView exists in debug only, absent from release dependency graph'

      - name: Compile debug and release source (no signing / no release)
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:compileDebugKotlin :app:compileReleaseKotlin --no-daemon --max-workers=2 --stacktrace --console=plain

      - name: Preserve dependency and compile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: station3d-dependency-isolation-report-NOT-APK
          path: build/reports/station3d/*.txt
          if-no-files-found: ignore
          retention-days: 7
