name: Paper Curl Device QA APK

on:
  push:
    branches:
      - "qa/paper-curl-physical-apk-lane-20261011"
      - "fix/paper-lab-native-gl-lifecycle-20261011"
      - "fix/first-open-milestone-room-race-20261011"
      - "grand-forge/open-source-paper-curl-arena-20261010"
    paths:
      - "app/**"
      - "tools/run_android_ci_emulator.sh"
      - "tools/collect_paper_device_evidence.py"
      - "tools/tests/test_collect_paper_device_evidence.py"
      - ".github/workflows/paper-curl-device-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-curl-device-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-paper-lab-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Distinct from BOTH production Veil Reader and pinned Forge QA.
      ORG_GRADLE_PROJECT_veilPaperLabQa: 'true'
      ORG_GRADLE_PROJECT_veilForgeRevision: ${{ github.sha }}
      VEIL_TEST_APPLICATION_ID: com.veilreader.app.paperlab
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Verify exact-APK local evidence capture safety guards
        run: python3 -m unittest discover -s tools/tests -p "test_collect_paper_device_evidence.py" -v

      - name: Compile unit instrumentation and lint separate Paper Lab
        run: >-
          gradle :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin
          :app:lintDebug :app:assembleDebug
          -PveilPaperLabQa=true -PveilForgeRevision="${GITHUB_SHA}" --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Paper Lab EPUB/PDF and primary launcher on emulator
        run: bash tools/run_android_ci_emulator.sh storage

      - name: Check fresh-only test APK identity and hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/paperlab
          APK="build/paperlab/VeilReader-PaperLab-${GITHUB_SHA:0:8}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$TOOLS_DIR" verify --verbose --print-certs "$APK" > build/paperlab/SIGNATURE.txt
          "$(dirname "$TOOLS_DIR")/aapt" dump badging "$APK" > build/paperlab/APK-METADATA.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          metadata = Path("build/paperlab/APK-METADATA.txt").read_text()
          sig = Path("build/paperlab/SIGNATURE.txt").read_text()
          assert "package: name='com.veilreader.app.paperlab'" in metadata, "Unexpected package; DO NOT DISTRIBUTE"
          assert "application-label:'Veil Paper Lab QA'" in metadata, "Wrong debug-only app label"
          assert "versionName='0.10.0-paperlab-" in metadata, "Missing traceable QA revision"
          assert "package: name='com.veilreader.app'" not in metadata, "Accidental main app collision"
          assert "package: name='com.veilreader.app.forgeqa'" not in metadata, "Pinned QA identity collision"
          hashes = re.findall(r"certificate SHA-256 digest:\s*([0-9a-fA-F:]+)", sig)
          assert hashes, "Signing certificate digest missing"
          actual = hashes[0].replace(":", "").lower()
          assert len(actual) == 64 and set(actual) <= set("0123456789abcdef"), "Malformed signing digest"
          pinned = Path("quality/forge-qa-signing-cert.sha256")
          if pinned.exists():
              assert actual != pinned.read_text().strip().lower(), "Paper Lab must not reuse Forge QA signing identity"
          PY
          printf 'source=%s\nrun=%s\npackage=com.veilreader.app.paperlab\nsignature=fresh-debug-only\nupdate_policy=uninstall_test_package_before_each_differently_signed_build\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > build/paperlab/BUILD.txt
          (cd build/paperlab && sha256sum "VeilReader-PaperLab-${GITHUB_SHA:0:8}.apk" > SHA256SUMS)

      - name: Upload side-by-side Paper Lab APK
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-paper-lab-device-apk
          path: build/paperlab/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve test and lint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-paper-lab-verification
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/lint-results-debug.xml
            app/build/outputs/androidTest-results/connected/debug/TEST-*.xml
            build/reports/logcat-storage.log
          if-no-files-found: ignore
          retention-days: 14
