name: Company OS Mobile Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Veil Reader command"
        required: true
        type: choice
        default: status
        options:
          - status
          - unit-tests
          - full-ci

permissions:
  contents: read

concurrency:
  group: company-os-mobile-${{ github.ref }}-${{ inputs.command }}
  cancel-in-progress: false

jobs:
  command:
    name: "${{ inputs.command }} on veil-reader-windows"
    runs-on: [self-hosted, Windows, X64, veil-reader]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        shell: powershell
        run: |
          android sdk install "platforms/android-37.0"
          android sdk install "build-tools/37.0.0"
          android sdk install "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Run Company OS command
        shell: powershell
        run: .\tools\company-os-mobile-command.ps1 -Command "${{ inputs.command }}"

      - name: Mobile result summary
        if: always()
        shell: powershell
        run: |
          "## Eyad Studio Mobile Command" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- Project: Veil Reader" >> $env:GITHUB_STEP_SUMMARY
          "- Command: \`${{ inputs.command }}\`" >> $env:GITHUB_STEP_SUMMARY
          "- Runner: \`veil-reader-windows\`" >> $env:GITHUB_STEP_SUMMARY
          "- Result: \`${{ job.status }}\`" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: \`${{ github.sha }}\`" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload debug APK for successful full-ci
        if: success() && inputs.command == 'full-ci'
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-mobile-command-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
