name: Room Schema Recovery

on:
  pull_request:
    paths:
      - ".github/workflows/room-schema-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Generate current v3 schema
        run: |
          gradle :app:kspDebugKotlin --stacktrace
          test -s app/schemas/com.veilreader.app.data.db.VeilDatabase/3.json

      - name: Generate historical v2 schema
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/veil-room-v2 cf5d523ff61be5a5823c041be8b1573e58667699
          (
            cd /tmp/veil-room-v2
            gradle :app:kspDebugKotlin --stacktrace
            test -s app/schemas/com.veilreader.app.data.db.VeilDatabase/2.json
          )

      - name: Collect generated history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p room-schema-recovery/com.veilreader.app.data.db.VeilDatabase
          cp /tmp/veil-room-v2/app/schemas/com.veilreader.app.data.db.VeilDatabase/2.json             room-schema-recovery/com.veilreader.app.data.db.VeilDatabase/2.json
          cp app/schemas/com.veilreader.app.data.db.VeilDatabase/3.json             room-schema-recovery/com.veilreader.app.data.db.VeilDatabase/3.json

      - name: Upload generated schema history
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-room-schema-history
          path: room-schema-recovery/
          if-no-files-found: error
          retention-days: 1

      - name: Commit recovered schemas and retire recovery workflow
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          schema_dir="app/schemas/com.veilreader.app.data.db.VeilDatabase"
          mkdir -p "$schema_dir"
          cp room-schema-recovery/com.veilreader.app.data.db.VeilDatabase/2.json "$schema_dir/2.json"
          cp room-schema-recovery/com.veilreader.app.data.db.VeilDatabase/3.json "$schema_dir/3.json"
          rm -f .github/workflows/room-schema-recovery.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$schema_dir/2.json" "$schema_dir/3.json" .github/workflows/room-schema-recovery.yml
          if git diff --cached --quiet; then
            echo "Room schema history is already canonical."
            exit 0
          fi
          git commit -m "fix(room): commit generated migration schema history"
          git push origin HEAD:"$TARGET_BRANCH"
