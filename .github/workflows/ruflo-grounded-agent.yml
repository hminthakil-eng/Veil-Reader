# Experimental source-grounded Ruflo review; read-only, no model API keys.
name: Ruflo Grounded Agent Evidence Gate
on:
  push:
    branches:
      - experiment/ruflo-keyless-cloud-20261021
    paths:
      - .github/workflows/ruflo-grounded-agent.yml
      - tools/experiments/ruflo_evidence_gate_v2.py
      - tools/experiments/test_ruflo_evidence_gate_v2.py
      - tools/experiments/ruflo_3b_wrong_endpoint_excerpt.md
  workflow_dispatch:

permissions: {}

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run adversarial regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/experiments -p 'test_ruflo_evidence_gate_v2.py' -v
          python3 tools/experiments/ruflo_evidence_gate_v2.py tools/experiments/ruflo_3b_wrong_endpoint_excerpt.md --expected-status FAIL

  source-grounded-inference:
    needs: deterministic-contract
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      CI: "true"
      NO_COLOR: "1"
      RUFLO_PROVIDER: ollama
      RUFLO_TELEMETRY: "false"
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_DEFAULT_MODEL: qwen2.5-coder:3b
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - name: Checkout experimental quality gate without credentials
        uses: actions/checkout@v6
        with:
          path: sandbox
          persist-credentials: false
      - name: Read exact PR 509 source without running its code
        uses: actions/checkout@v6
        with:
          ref: e37869bb68e0497b5cbb9ca9f9b56c4e53286020
          path: source
          persist-credentials: false
      - name: Verify source evidence files before inference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          d=Path('source')
          verifier=(d/'tools/verify_dependency_review_snapshots.py').read_text()
          baseline=(d/'.github/workflows/dependency-baseline.yml').read_text()
          review=(d/'.github/workflows/dependency-review.yml').read_text()
          assert '/dependency-graph/compare/' in verifier, 'expected true compare API not present'
          assert 'x-github-dependency-graph-snapshot-warnings' in verifier, 'snapshot warning header missing'
          assert 'GITHUB_DEPENDENCY_GRAPH_SHA' in baseline, 'dependency SHA metadata missing'
          assert 'github.event.pull_request.head.sha' in review, 'exact PR SHA check missing'
          print('PASS: exact source files present, verified for read-only evidence')
          PY
      - name: Start pinned Ruflo and isolated local model on cloud host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruflo-grounded"
          cd "$RUNNER_TEMP/ruflo-grounded"
          npm install --no-save --ignore-scripts=false --no-audit --no-fund ruflo@3.59.8 better-sqlite3@12.9.0
          curl -fsSL https://ollama.com/install.sh -o "$RUNNER_TEMP/ollama-install.sh"
          bash "$RUNNER_TEMP/ollama-install.sh"
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:3b
          ./node_modules/.bin/ruflo swarm init --topology hierarchical --max-agents 2
          ./node_modules/.bin/ruflo agent spawn --type researcher --name evidence-investigator --provider ollama --model qwen2.5-coder:3b
          ./node_modules/.bin/ruflo agent spawn --type reviewer --name adversarial-auditor --provider ollama --model qwen2.5-coder:3b

      - name: Give model verified code evidence, not prewritten conclusions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ruflo-grounded"
          cat > grounded.mjs <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {resolve,join} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const root=process.env.GITHUB_WORKSPACE;
          const src=join(root,'source');
          const read=(p,n=4500)=>readFileSync(join(src,p),'utf8').slice(0,n);
          const verifier=read('tools/verify_dependency_review_snapshots.py',4000);
          const baseline=read('.github/workflows/dependency-baseline.yml',4400);
          const review=read('.github/workflows/dependency-review.yml',1800);
          const evidence='EXACT source commit: e37869bb68e0497b5cbb9ca9f9b56c4e53286020\n'
            +'Exact base SHA: bfac95f4b82e23b9f277f985bf3282f3e9c584fb\n'
            +'Prior runtime log: submission GITHUB_DEPENDENCY_GRAPH_SHA=e37869bb68e0497b5cbb9ca9f9b56c4e53286020, '
            +'GITHUB_DEPENDENCY_GRAPH_REF=refs/pull/509/merge. Review comparison timed out at 600s with missing HEAD snapshot.\n'
            +'Proposed alternative to TEST (not verified): refs/heads/reader/native-paper-rebuild-20261011\n'
            +'== verify_dependency_review_snapshots.py ==\n'+verifier+'\n== dependency-baseline.yml ==\n'+baseline+
            '\n== dependency-review.yml ==\n'+review;
          const agents=Object.values(JSON.parse(readFileSync('.claude-flow/agents/store.json','utf8')).agents);
          const investigator=agents.find(x=>x.agentType==='researcher');
          const reviewer=agents.find(x=>x.agentType==='reviewer');
          if(!investigator || !reviewer) throw Error('Missing agent records');
          const {executeAgentTask}=await import(pathToFileURL(resolve('node_modules/@claude-flow/cli/dist/src/mcp-tools/agent-execute-core.js')).href);
          const exactApi='/repos/hminthakil-eng/Veil-Reader/dependency-graph/compare/bfac95f4b82e23b9f277f985bf3282f3e9c584fb...e37869bb68e0497b5cbb9ca9f9b56c4e53286020?per_page=5';
          async function task(agent,prompt){
            const x=await executeAgentTask({agentId:agent.agentId,prompt,maxTokens:620,timeoutMs:190000,temperature:0.1});
            console.log('INFERENCE '+JSON.stringify({role:agent.agentType,success:x.success,model:x.model,usage:x.usage,durationMs:x.durationMs,error:x.error||null}));
            if(!x.success || !x.output || x.output.trim().length<130) throw Error('No usable LLM response for '+agent.agentType);
            return x.output.trim();
          }
          const a=await task(investigator,'Respond ONLY with your analysis body; do not add a heading. Source-grounded CI diagnosis. Required: distinguish Observation from Hypothesis, quote exact base and head SHA, mention observed refs/pull/509/merge and proposed UNPROVEN test refs/heads/reader/native-paper-rebuild-20261011, provide the exact dependency graph comparison API path '+exactApi+' and the header x-github-dependency-graph-snapshot-warnings. Define an isolated experiment and failure conditions. NEVER use the ordinary GitHub commits comparison API. DO NOT approve a merge.\nSOURCE EVIDENCE:\n'+evidence);
          const b=await task(reviewer,'Review this UNTRUSTED investigator answer critically against the original source evidence. Respond ONLY with reviewer body; do not add heading. REQUIRE: independent alternative cause/risk, exact dependency compare API path '+exactApi+' and x-github-dependency-graph-snapshot-warnings. A valid empty header plus complete policy evaluation is required; missing/incomplete snapshot means fail. End with an exact line: Decision: BLOCK. Never use ordinary commits comparison API. Explicitly reject an incorrect API if investigator used one.\nSOURCE EVIDENCE:\n'+evidence+'\nUNTRUSTED DRAFT:\n'+a);
          const report='# PR 509 Ruflo source-grounded review (unverified agent output)\n\n'
            +'> Proposed fixes are NOT validated. No agent can modify product code.\n\n'
            +'## CI investigator\n'+a+'\n\n## Skeptical reviewer\n'+b+'\n';
          writeFileSync('grounded-report.md',report);
          console.log('Ruflo completed two real local inference calls; report requires independent deterministic gating');
          NODE
          node grounded.mjs

      - name: Fail closed on model report omissions and hallucinated API paths
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ruflo-grounded"
          python3 "$GITHUB_WORKSPACE/sandbox/tools/experiments/ruflo_evidence_gate_v2.py" grounded-report.md | tee gate-result.json
          {
            echo "## Source-grounded Ruflo pilot"
            echo "Model: qwen2.5-coder:3b; source: exact PR 509 commit; no secrets, no product writes"
            echo "PASS means contract-only evidence, never authorization to merge"
            echo "Read generated report in artifact; expert review is still required"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Always preserve agent draft for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruflo-grounded-source-review
          path: |
            ${{ runner.temp }}/ruflo-grounded/grounded-report.md
            ${{ runner.temp }}/ruflo-grounded/gate-result.json
          if-no-files-found: warn
          retention-days: 3
