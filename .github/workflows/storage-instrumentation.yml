name: Storage Instrumentation

on:
  pull_request:
    paths:
      - "app/src/main/java/com/veilreader/app/data/**"
      - "app/src/androidTest/**"
      - "app/schemas/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/storage-instrumentation.yml"
      - "tools/run_android_ci_emulator.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-instrumentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  room-on-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Room instrumentation tests
        run: bash tools/run_android_ci_emulator.sh storage

      - name: Upload instrumentation reports on failure only
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-storage-instrumentation
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/reports/
          if-no-files-found: ignore
          retention-days: 1
