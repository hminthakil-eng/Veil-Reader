name: Storage Instrumentation

on:
  pull_request:
    branches: [ "grand-forge/p0-kindle-reader-quality-20261008", "grand-forge/tts-neural-shared-assets-hardening-v1", "grand-forge/tts-listening-mode-v1", "grand-forge/arena-app-hardening-v1", "integration/page-engine-canonical-v1", "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-instrumentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  room-on-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Warm Android emulator SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          IMAGE="system-images;android-35;default;x86_64"
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install platform-tools emulator "$IMAGE" </dev/null; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "Android SDK/emulator package installation failed after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Room instrumentation tests
        run: bash tools/run_android_ci_emulator.sh storage

      - name: Print instrumentation failures
        if: failure()
        run: |
          python3 - <<'PY_REPORT'
          import glob
          import xml.etree.ElementTree as ET
          for path in sorted(glob.glob("app/build/outputs/androidTest-results/connected/debug/**/TEST-*.xml", recursive=True)):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      print(f"{case.get('classname')}.{case.get('name')}: {failure.get('message')}")
                      print("\n".join((failure.text or "").splitlines()[:30]))
          PY_REPORT
          if [ -f build/reports/logcat-storage.log ]; then
            rg 'FATAL EXCEPTION|AndroidRuntime|GpuMaterialPageCurl' build/reports/logcat-storage.log | tail -80 || true
          fi

      - name: Upload production Compose review captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-grayfog-shell-review
          path: |
            build/reports/grayfog-review.tar
            build/reports/veil-grayfog-review/
            app/build/outputs/androidTest-results/connected/debug/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload instrumentation reports on failure only
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-storage-instrumentation
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/reports/
          if-no-files-found: ignore
          retention-days: 1
