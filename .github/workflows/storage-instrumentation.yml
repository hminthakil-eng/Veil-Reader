name: Storage Instrumentation

on:
  pull_request:
    paths:
      - "app/src/main/java/com/veilreader/app/data/**"
      - "app/src/androidTest/**"
      - "app/src/main/java/com/veilreader/app/ui/**"
      - "app/src/main/java/com/veilreader/app/domain/**"
      - "app/schemas/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/storage-instrumentation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  room-on-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run storage and Compose interaction tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/run-instrumentation.sh

      - name: Test summaries and screenshot review payloads
        if: always()
        run: python3 tools/emit-ui-previews.py

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veil-reader-storage-instrumentation
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/ui-screenshots/
          if-no-files-found: ignore
