name: Storage Instrumentation

on:
  pull_request:
    branches: [ "grand-forge/p0-kindle-reader-quality-20261008", "grand-forge/tts-neural-shared-assets-hardening-v1", "grand-forge/tts-listening-mode-v1", "grand-forge/arena-app-hardening-v1", "integration/page-engine-canonical-v1", "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-instrumentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  room-on-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checkout mismatch: expected $EXPECTED_SHA, got $actual_sha"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Warm Android emulator SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          IMAGE="system-images;android-35;default;x86_64"
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install platform-tools emulator "$IMAGE" </dev/null; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "Android SDK/emulator package installation failed after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Room instrumentation tests
        id: room_tests
        run: bash tools/run_android_ci_emulator.sh storage

      # A green Gradle exit alone does not prove the specific flaky test ran.
      # Keep a small, independent XML receipt on both success and failure.
      - name: Verify both progress durability regressions executed
        if: ${{ steps.room_tests.outcome == 'success' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          from xml.etree import ElementTree as ET

          report_dir = Path("app/build/outputs/androidTest-results/connected")
          reports = sorted(report_dir.rglob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No instrumentation JUnit XML found; cannot certify test execution")
          required = (
              "rapidProgressEvents_coalesceToOneDatabaseUpdate_withLatestLocator",
              "importedBookObserverChurn_neverDropsImmediateProgressFlush",
          )
          counts = Counter()
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  name = case.attrib.get("name", "")
                  if name in required:
                      counts[name] += 1
                      if any(child.tag in ("failure", "error", "skipped") for child in case):
                          raise SystemExit(f"Required test did not pass: {name} ({report})")
          for name in required:
              if counts[name] != 1:
                  raise SystemExit(f"Expected exactly one passing {name}, observed {counts[name]}")
          print(f"Verified {len(required)} targeted tests in {len(reports)} JUnit report(s)")
          PY

      - name: Upload focused progress JUnit evidence
        if: ${{ always() && (steps.room_tests.outcome == 'success' || steps.room_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-progress-junit
          path: app/build/outputs/androidTest-results/connected/**/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload production Compose review captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-grayfog-shell-review
          path: |
            build/reports/grayfog-review.tar
            build/reports/veil-grayfog-review/
            app/build/outputs/androidTest-results/connected/debug/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload instrumentation reports on failure only
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-storage-instrumentation
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/reports/
          if-no-files-found: ignore
          retention-days: 1
