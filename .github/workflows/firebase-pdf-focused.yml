name: Firebase Focused PDF Gate

on:
  push:
    branches:
      - qa/firebase-test-lab-pilot

permissions:
  contents: read
  id-token: write

jobs:
  pdf-rotation-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Build app and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TESTLAB_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Run focused PDF rotation/chrome gate
        run: |
          gcloud config set project "${{ secrets.FIREBASE_PROJECT_ID }}"
          gcloud firebase test android run             --type instrumentation             --app app/build/outputs/apk/debug/app-debug.apk             --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk             --device model="MediumPhone.arm",version="35",locale=en,orientation=portrait             --test-targets "class com.veilreader.app.ReaderPdfReliabilityInstrumentedTest#importedPdf_exposesFitLayoutAndSurvivesRotation"             --timeout 20m             --num-flaky-test-attempts 0             --client-details matrixLabel="Veil focused PDF ${{ github.sha }}"
