name: Victorian Station Architecture CI

on:
  pull_request:
    branches:
      - design/market-leaders-rebuild-20261017
    paths:
      - 'app/**'
      - 'docs/architecture/ADR-021-VICTORIAN-STATION-SPATIAL-SHELL.md'
      - '.github/workflows/victorian-station-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: victorian-station-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Pure policy and genuine Compose station tests
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest \
            --tests 'com.veilreader.app.ui.station.*' \
            --tests 'com.veilreader.app.ui.screens.RebornThresholdScreenTest' \
            --no-daemon --max-workers=2 --stacktrace --console=plain

      - name: Provision disposable isolated QA signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .forge-qa
          keytool -genkeypair -keystore .forge-qa/debug.keystore \
            -alias AndroidDebugKey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Veil Reader Station QA,OU=Test Build,O=Eyad Studio,C=US' -noprompt

      - name: Assemble experimental station debug-only APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug \
            -PveilForgeQa=true -PveilRebornThreshold=true -PveilVictorianStation=true \
            -PveilForgeRevision="${GITHUB_SHA}" \
            --no-daemon --max-workers=2 --stacktrace --console=plain

      - name: Retain APK and real Compose render evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: victorian-station-architecture-review-NOT-RELEASE
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/station/compose-render/*.png
            app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7
