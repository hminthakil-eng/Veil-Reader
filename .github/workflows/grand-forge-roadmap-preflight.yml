name: Grand Forge Roadmap Preflight

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  roadmap-stage-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout trusted main (not contributor scripts)
        uses: actions/checkout@v7
        with:
          # Bootstrap PR #500 is trusted repository-owned source before the gate exists on main.
          # All later PRs execute the implementation already reviewed on main.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 500 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
      - name: Run fail-closed stage gate regression tests
        run: python3 -m unittest discover -s tools -p test_roadmap_stage_gate.py -v
      - name: Validate receipt before new PR work
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/roadmap_stage_gate.py pr-check
      - name: Explain limitations
        if: always()
        run: |
          echo "Stage gate checks recorded preflight/completion evidence, not whether the physical product works." >> "$GITHUB_STEP_SUMMARY"
          echo "Required-check enforcement needs GitHub branch protection; do not merge a failed/pending PR." >> "$GITHUB_STEP_SUMMARY"
