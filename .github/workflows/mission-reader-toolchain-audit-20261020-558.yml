name: Reader build-tool dependency audit

on:
  push:
    branches: ["diagnostics/reader-toolchain-20261020-558"]

permissions:
  contents: read

jobs:
  inspect-exact-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout mission payload and exact parent
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Preserve diagnostic payload and recover exact product source
        run: |
          test "$(git rev-parse HEAD^)" = "e182b46cdf982383c96bbe26dfc0dc521263c08c"
          git rev-parse HEAD
          sha256sum tools/mission_reader_toolchain_audit_20261020.gradle
          cp tools/mission_reader_toolchain_audit_20261020.gradle "$RUNNER_TEMP/reader-audit.gradle"
          git checkout --detach e182b46cdf982383c96bbe26dfc0dc521263c08c
          test "$(git rev-parse HEAD)" = "e182b46cdf982383c96bbe26dfc0dc521263c08c"
          test -z "$(git status --porcelain)"
      - name: Set up repository JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up repository Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"
          cache-read-only: true
      - name: Inspect resolved build classpaths and AGP-loaded provider
        run: gradle --no-daemon --console=plain -I "$RUNNER_TEMP/reader-audit.gradle" buildEnvironment
