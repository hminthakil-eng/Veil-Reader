name: Reader Durability Fault Injection

on:
  pull_request:
    branches: [ "grand-forge/arena-app-hardening-v1", "integration/page-engine-canonical-v1", "main" ]
    paths:
      - "app/src/main/java/com/veilreader/app/data/LocalLibraryRepository.kt"
      - "app/src/main/java/com/veilreader/app/ui/reader/ReaderLocatorPolicy.kt"
      - "app/src/main/java/com/veilreader/app/ui/reader/ReaderViewModel.kt"
      - "app/src/debug/**"
      - "tools/run_android_ci_emulator.sh"
      - ".github/workflows/reader-durability-fault-injection.yml"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Cycles per scenario (6 scenarios; 18 = 108 abrupt-process samples)"
        required: false
        default: "18"

permissions:
  contents: read

concurrency:
  group: reader-durability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abrupt-process:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VEIL_DURABILITY_CYCLES: ${{ github.event_name == 'workflow_dispatch' && inputs.cycles || '18' }}

    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Warm Android emulator SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          IMAGE="system-images;android-35;default;x86_64"
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install platform-tools emulator "$IMAGE" </dev/null; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "Android SDK/emulator package installation failed after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run abrupt process-death Reader matrix
        run: bash tools/run_android_ci_emulator.sh durability

      - name: Upload durability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-durability-fault-injection
          path: |
            build/reports/reader-durability-fault-injection.txt
            build/reports/emulator-durability.log
            build/reports/logcat-durability.log
          if-no-files-found: ignore
          retention-days: 14
