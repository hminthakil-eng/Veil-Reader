name: Reader P0 Device APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Reader P0 regression tests
        run: >
          gradle :app:testDebugUnitTest
          --tests com.veilreader.app.ui.screens.MaterialPageRolloutContractTest
          --tests com.veilreader.app.ui.screens.ReaderModeHandoffPolicyTest
          --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Reader P0 APK
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-reader-p0-fix-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
