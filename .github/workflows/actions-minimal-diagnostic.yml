name: Actions Minimal Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - diag/actions-minimal

permissions:
  contents: read

jobs:
  android-base:
    runs-on: [self-hosted, Windows, X64, veil-reader]
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Reading policy regression checks
        shell: powershell
        run: '& "$env:ProgramFiles\Git\bin\bash.exe" tools/test-policy.sh'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        shell: powershell
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        shell: powershell
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        shell: powershell
        run: gradle :app:assembleDebug --stacktrace
