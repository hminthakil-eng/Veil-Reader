name: Actions Minimal Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - diag/actions-minimal

permissions:
  contents: read

jobs:
  android-base:
    runs-on: [self-hosted, Windows, X64, veil-reader]
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Use provisioned Android SDK
        shell: powershell
        run: |
          $sdk = 'C:\Users\Microsoft\AppData\Local\Android\Sdk'
          if (!(Test-Path "$sdk\platforms\android-37.0")) { throw "Android API 37 missing" }
          if (!(Test-Path "$sdk\build-tools\37.0.0")) { throw "Build tools 37.0.0 missing" }
          if (!(Test-Path "$sdk\platform-tools\adb.exe")) { throw "Platform tools missing" }
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\platform-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Reading policy regression checks
        shell: powershell
        run: '& "$env:ProgramFiles\Git\bin\bash.exe" tools/test-policy.sh'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        shell: powershell
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        shell: powershell
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        shell: powershell
        run: gradle :app:assembleDebug --stacktrace
