name: Actions Minimal Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - diag/actions-minimal

permissions:
  contents: read

jobs:
  android-base:
    runs-on: [self-hosted, Windows, X64, veil-reader]
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure existing Android SDK
        shell: powershell
        run: |
          $sdk = 'C:\Users\Microsoft\AppData\Local\Android\Sdk'
          $android = "$sdk\cmdline-tools\latest\bin\android.exe"
          if (!(Test-Path $android)) { throw "Android CLI missing at $android" }
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\platform-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$sdk\cmdline-tools\latest\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $android sdk install "platforms/android-37.0"
          if ($LASTEXITCODE -ne 0) { throw "platform install failed: $LASTEXITCODE" }
          & $android sdk install "build-tools/37.0.0"
          if ($LASTEXITCODE -ne 0) { throw "build-tools install failed: $LASTEXITCODE" }
          & $android sdk install "platform-tools"
          if ($LASTEXITCODE -ne 0) { throw "platform-tools install failed: $LASTEXITCODE" }

      - name: Reading policy regression checks
        shell: powershell
        run: '& "$env:ProgramFiles\Git\bin\bash.exe" tools/test-policy.sh'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        shell: powershell
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        shell: powershell
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        shell: powershell
        run: gradle :app:assembleDebug --stacktrace
