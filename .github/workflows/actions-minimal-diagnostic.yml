name: Actions Minimal Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - diag/actions-minimal

jobs:
  ping:
    runs-on: [self-hosted, Windows, X64, veil-reader]
    timeout-minutes: 5
    steps:
      - name: Runner alive
        shell: powershell
        run: |
          Write-Output "runner-ok"
          Write-Output $env:COMPUTERNAME
          Write-Output $PSVersionTable.PSVersion
