name: Actions Minimal Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - diag/actions-minimal

permissions:
  contents: read

jobs:
  reader-rc:
    runs-on: [self-hosted, Windows, X64, veil-reader]
    timeout-minutes: 60
    steps:
      - name: Checkout Reader RC
        uses: actions/checkout@v7
        with:
          ref: integration/reader-rc-v2
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Use provisioned Android SDK
        shell: powershell
        run: |
          $sdk = 'C:\Users\Microsoft\AppData\Local\Android\Sdk'
          if (!(Test-Path "$sdk\platforms\android-37.0")) { throw "Android API 37 missing" }
          if (!(Test-Path "$sdk\platform-tools\adb.exe")) { throw "adb missing" }
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\platform-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Reading policy regression checks
        shell: powershell
        run: '& "$env:ProgramFiles\Git\bin\bash.exe" tools/test-policy.sh'

      - name: Unit tests
        shell: powershell
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compile instrumentation tests
        shell: powershell
        run: gradle :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Android lint
        shell: powershell
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        shell: powershell
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify API 35 emulator
        shell: powershell
        run: |
          $adb = 'C:\Users\Microsoft\AppData\Local\Android\Sdk\platform-tools\adb.exe'
          & $adb -s emulator-5554 wait-for-device
          $api = (& $adb -s emulator-5554 shell getprop ro.build.version.sdk).Trim()
          $boot = (& $adb -s emulator-5554 shell getprop sys.boot_completed).Trim()
          if ($api -ne '35') { throw "Expected API 35, got $api" }
          if ($boot -ne '1') { throw "Emulator not booted" }

      - name: Connected instrumentation
        shell: powershell
        run: gradle :app:connectedDebugAndroidTest --stacktrace
