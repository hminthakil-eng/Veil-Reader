name: Sherpa TTS Stop Patch Audit

on:
  pull_request:
    paths:
      - 'tools/sherpa-onnx-engine-patch/**'
      - '.github/workflows/sherpa-tts-stop-patch-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Veil's patch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout exact upstream source (not moving master)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: k2-fsa/sherpa-onnx
          ref: 9db1af1871ed78cee9357c23898e5a7d8702d21a
          path: sherpa-upstream
          persist-credentials: false
          submodules: false
      - name: Verify upstream blob and cleanly apply stop patch
        shell: bash
        run: |
          set -euo pipefail
          target='android/SherpaOnnxTtsEngine/app/src/main/java/com/k2fsa/sherpa/onnx/tts/engine/TtsService.kt'
          patch="$GITHUB_WORKSPACE/tools/sherpa-onnx-engine-patch/0001-cancellable-synthesis-and-pause.patch"
          expected='05ef5d3d6d553646bec8cdcf4f9240d2ccda7f60'
          actual="$(git -C sherpa-upstream hash-object "$target")"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Upstream TtsService has changed; re-review before applying" >&2
            exit 1
          fi
          git -C sherpa-upstream apply --check "$patch"
          git -C sherpa-upstream apply "$patch"
          privacy_patch="$GITHUB_WORKSPACE/tools/sherpa-onnx-engine-patch/0002-remove-plaintext-narration-logs.patch"
          git -C sherpa-upstream apply --check "$privacy_patch"
          git -C sherpa-upstream apply "$privacy_patch"
          voice_patch="$GITHUB_WORKSPACE/tools/sherpa-onnx-engine-patch/0003-kokoro-multivoice-identity.patch"
          git -C sherpa-upstream apply --check "$voice_patch"
          git -C sherpa-upstream apply "$voice_patch"
          git -C sherpa-upstream diff --check
          grep -Fq 'cancellationGeneration.incrementAndGet()' "sherpa-upstream/$target"
          grep -Fq 'if (isCancelled()) return 0' "sherpa-upstream/$target"
          grep -Fq 'callback.audioAvailable(samples, offset, bytesToWrite) !=' "sherpa-upstream/$target"
          grep -Fq 'override fun onGetVoices()' "sherpa-upstream/$target"
          grep -Fq 'sid = requestedSpeakerId' "sherpa-upstream/$target"
          if grep -Eq 'Log\\.(i|d|v|w|e)\\(TAG, "text:' "sherpa-upstream/$target"; then
            echo "::error::The book text is still logged in the patched TTS service" >&2
            exit 1
          fi
          echo 'Patch applies and cancellation guards are present.'
      - name: Display explicit acceptance limitation
        run: |
          echo 'NOTE: This gate verifies patch integrity only.'
          echo 'It does not build a patched Sherpa APK or prove audible Pause on an Android device.'
