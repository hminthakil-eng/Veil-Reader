name: Self-hosted Android Verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to verify"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  windows-verify:
    runs-on: [self-hosted, Windows, X64, veil-reader]
    timeout-minutes: 45
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record verified commit
        shell: powershell
        run: |
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve checkout SHA." }
          "Verified commit: $sha" | Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        shell: powershell
        run: android sdk install "platforms/android-37.0"

      - name: Install Android build tools
        shell: powershell
        run: android sdk install "build-tools/37.0.0"

      - name: Install Android platform tools
        shell: powershell
        run: android sdk install "platform-tools"

      - name: Reading policy regression checks
        shell: powershell
        run: '& "$env:ProgramFiles\Git\bin\bash.exe" tools/test-policy.sh'

      - name: Performance budget parser checks
        shell: powershell
        run: python tools/test_performance_budget.py

      - name: Performance delta parser checks
        shell: powershell
        run: python tools/test_performance_delta.py

      - name: Performance dashboard parser checks
        shell: powershell
        run: python tools/test_performance_dashboard.py

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        shell: powershell
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Verify committed Room schema
        shell: powershell
        run: |
          $changes = git status --porcelain --untracked-files=all -- app/schemas/
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect Room schemas." }
          if ($changes) { throw "Room schemas differ from the committed checkout: $changes" }

      - name: Android lint
        shell: powershell
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        shell: powershell
        run: gradle :app:assembleDebug --stacktrace

      - name: Compile instrumentation tests
        shell: powershell
        run: gradle :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Verify release R8 build
        shell: powershell
        run: gradle :app:assembleRelease --stacktrace

      - name: Compile performance harness
        shell: powershell
        run: gradle :benchmark:assembleBenchmarkBenchmark --stacktrace
