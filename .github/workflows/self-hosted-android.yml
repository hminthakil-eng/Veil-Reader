name: Self-hosted Android Verification

on:
  push:
    branches:
      - "release/reader-hardening-rc"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to verify"
        required: false
        default: "release/reader-hardening-rc"

permissions:
  contents: read

concurrency:
  group: reader-release-hardening
  cancel-in-progress: ${{ github.event_name == 'push' && github.actor != 'github-actions[bot]' }}

jobs:
  windows-preflight:
    runs-on: [self-hosted, Windows, X64, veil-reader]
    timeout-minutes: 35
    steps:
      - name: Inventory runner storage before checkout
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Runner=$env:RUNNER_NAME OS=$env:RUNNER_OS Architecture=$env:RUNNER_ARCH"
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Select-Object DeviceID,FreeSpace,Size | Format-Table -AutoSize
          Get-CimInstance Win32_Service | Where-Object { $_.Name -like "actions.runner*" } |
            Select-Object Name,State,PathName | Format-List
          $paths = [ordered]@{
            GITHUB_WORKSPACE = $env:GITHUB_WORKSPACE
            RUNNER_TEMP = $env:RUNNER_TEMP
            RUNNER_TOOL_CACHE = $env:RUNNER_TOOL_CACHE
            GRADLE_USER_HOME = $env:GRADLE_USER_HOME
            ANDROID_SDK_ROOT = $env:ANDROID_SDK_ROOT
            ANDROID_HOME = $env:ANDROID_HOME
            ANDROID_AVD_HOME = $env:ANDROID_AVD_HOME
            TEMP = $env:TEMP
            TMP = $env:TMP
          }
          foreach ($entry in $paths.GetEnumerator()) { Write-Host "$($entry.Key)=$($entry.Value)" }
          $invalid = @()
          foreach ($name in @("GITHUB_WORKSPACE", "RUNNER_TEMP", "RUNNER_TOOL_CACHE")) {
            $path = $paths[$name]
            if (-not $path -or [IO.Path]::GetPathRoot($path) -ne "E:\") { $invalid += $name }
            if ($path) {
              $ancestor = $path
              while ($ancestor) {
                if (Test-Path -LiteralPath $ancestor) {
                  $item = Get-Item -LiteralPath $ancestor -Force
                  if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                    Write-Host "Unverified reparse point: $ancestor -> $($item.Target)"
                    $invalid += $name
                  }
                }
                $ancestor = Split-Path -Path $ancestor -Parent
              }
            }
          }
          if ($invalid.Count) {
            throw "Runner storage migration required before checkout/build: $($invalid -join ', '). Configure runner work and tool cache on E: and restart the runner. No Android work has started."
          }

      - name: Checkout release candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Prepare CI scratch on E drive
        shell: powershell
        run: |
          & ".\tools\prepare_ci_scratch.ps1" -MinimumScratchGB 12


      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure existing Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "E:\VeilReader-CI\android-sdk",
            $env:ANDROID_SDK_ROOT,
            $env:ANDROID_HOME
          ) | Where-Object { $_ -and (Test-Path $_) }
          $sdk = $candidates | Select-Object -First 1
          if (-not $sdk) { throw "Android SDK not found" }
          $sdk = (Resolve-Path $sdk).Path
          if ([IO.Path]::GetPathRoot($sdk) -ne "E:\") { throw "Android SDK must be migrated to E: before this job can run: $sdk" }
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append


      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Verify relocated preflight disk headroom
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:VEIL_CI_SCRATCH_DRIVE) { throw "VEIL_CI_SCRATCH_DRIVE is not set" }
          $scratch = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Where-Object { $_.DeviceID -eq $env:VEIL_CI_SCRATCH_DRIVE } |
            Select-Object -First 1
          if (-not $scratch) { throw "Could not resolve CI scratch drive $env:VEIL_CI_SCRATCH_DRIVE" }
          $freeGB = [int64]$scratch.FreeSpace / 1GB
          Write-Host ("CI scratch {0}\ free={1:N2} GB" -f $env:VEIL_CI_SCRATCH_DRIVE, $freeGB)
          if ($freeGB -lt 12) { throw ("CI scratch has only {0:N2} GB free; require >= 12 GB" -f $freeGB) }

      - name: Reading policy regression checks
        shell: powershell
        run: '& "$env:ProgramFiles\Git\bin\bash.exe" tools/test-policy.sh'

      - name: Performance budget parser checks
        shell: powershell
        run: |
          foreach ($test in @("tools/test_performance_budget.py", "tools/test_performance_delta.py", "tools/test_performance_dashboard.py")) {
            python $test
            if ($LASTEXITCODE -ne 0) { throw "Performance parser check failed: $test" }
          }

      - name: Unit tests
        shell: powershell
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Verify committed Room schema
        shell: powershell
        run: git diff --exit-code -- app/schemas/

      - name: Android lint
        shell: powershell
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        shell: powershell
        run: gradle :app:assembleDebug --stacktrace

      - name: Compile release-like benchmark harness
        shell: powershell
        run: gradle :app:assembleBenchmark :benchmark:assembleBenchmarkBenchmark --stacktrace


  windows-verify:
    needs: windows-preflight
    runs-on: [self-hosted, Windows, X64, veil-reader]
    timeout-minutes: 45
    steps:
      - name: Inventory runner storage before checkout
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Runner=$env:RUNNER_NAME OS=$env:RUNNER_OS Architecture=$env:RUNNER_ARCH"
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Select-Object DeviceID,FreeSpace,Size | Format-Table -AutoSize
          Get-CimInstance Win32_Service | Where-Object { $_.Name -like "actions.runner*" } |
            Select-Object Name,State,PathName | Format-List
          $paths = [ordered]@{
            GITHUB_WORKSPACE = $env:GITHUB_WORKSPACE
            RUNNER_TEMP = $env:RUNNER_TEMP
            RUNNER_TOOL_CACHE = $env:RUNNER_TOOL_CACHE
            GRADLE_USER_HOME = $env:GRADLE_USER_HOME
            ANDROID_SDK_ROOT = $env:ANDROID_SDK_ROOT
            ANDROID_HOME = $env:ANDROID_HOME
            ANDROID_AVD_HOME = $env:ANDROID_AVD_HOME
            TEMP = $env:TEMP
            TMP = $env:TMP
          }
          foreach ($entry in $paths.GetEnumerator()) { Write-Host "$($entry.Key)=$($entry.Value)" }
          $invalid = @()
          foreach ($name in @("GITHUB_WORKSPACE", "RUNNER_TEMP", "RUNNER_TOOL_CACHE")) {
            $path = $paths[$name]
            if (-not $path -or [IO.Path]::GetPathRoot($path) -ne "E:\") { $invalid += $name }
            if ($path) {
              $ancestor = $path
              while ($ancestor) {
                if (Test-Path -LiteralPath $ancestor) {
                  $item = Get-Item -LiteralPath $ancestor -Force
                  if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                    Write-Host "Unverified reparse point: $ancestor -> $($item.Target)"
                    $invalid += $name
                  }
                }
                $ancestor = Split-Path -Path $ancestor -Parent
              }
            }
          }
          if ($invalid.Count) {
            throw "Runner storage migration required before checkout/build: $($invalid -join ', '). Configure runner work and tool cache on E: and restart the runner. No Android work has started."
          }

      - name: Checkout requested ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout triggering ref
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Skip superseded push run
        if: github.event_name == 'push'
        id: superseded
        shell: powershell
        run: |
          $remote = (git ls-remote origin refs/heads/release/reader-hardening-rc).Split()[0]
          if (-not $remote) { throw "Could not resolve remote hardening branch tip" }
          if ($remote -ne $env:GITHUB_SHA) {
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Superseded run: $env:GITHUB_SHA; current branch tip is $remote"
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Prepare release scratch on E drive
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          & ".\tools\prepare_ci_scratch.ps1" -MinimumScratchGB 12


      - name: Set up JDK 17
        if: steps.superseded.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure existing Android SDK
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "E:\VeilReader-CI\android-sdk",
            $env:ANDROID_SDK_ROOT,
            $env:ANDROID_HOME
          ) | Where-Object { $_ -and (Test-Path $_) }

          $sdk = $candidates | Select-Object -First 1
          if (-not $sdk) {
            throw "Android SDK not found. Expected ANDROID_SDK_ROOT, ANDROID_HOME, or %LOCALAPPDATA%\Android\Sdk."
          }

          $sdk = (Resolve-Path $sdk).Path
          if ([IO.Path]::GetPathRoot($sdk) -ne "E:\") { throw "Android SDK must be migrated to E: before this job can run: $sdk" }
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $sdk "platform-tools") | Out-File -FilePath $env:GITHUB_PATH -Append
          (Join-Path $sdk "emulator") | Out-File -FilePath $env:GITHUB_PATH -Append
          (Join-Path $sdk "cmdline-tools\latest\bin") | Out-File -FilePath $env:GITHUB_PATH -Append

          $sdkManager = Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkManager)) {
            throw "sdkmanager.bat not found at $sdkManager"
          }

          Write-Host "Using Android SDK: $sdk"
          & $sdkManager --version
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager version check failed" }


      - name: Verify Android SDK packages
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if (-not $sdk) { throw "ANDROID_SDK_ROOT/ANDROID_HOME is not set" }

          $androidCli = Join-Path $sdk "cmdline-tools\latest\bin\android.bat"
          if (-not (Test-Path $androidCli)) { $androidCli = "android" }

          $sdkManager = Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkManager)) { throw "sdkmanager.bat not found at $sdkManager" }

          function Ensure-AndroidComponent {
            param([string]$Name, [string]$Probe, [string]$AndroidCliPackage)
            if (Test-Path $Probe) {
              Write-Host "Android SDK component already present: $Name -> $Probe"
              return
            }
            Write-Host "Installing missing Android SDK component: $Name ($AndroidCliPackage)"
            & $androidCli sdk install $AndroidCliPackage | Out-Host
            if (-not (Test-Path $Probe)) {
              throw "Android SDK component still missing after install attempt: $Name ($Probe)"
            }
            Write-Host "Android SDK component installed: $Name"
          }

          $platformProbe = @(
            (Join-Path $sdk "platforms\android-37.0\android.jar"),
            (Join-Path $sdk "platforms\android-37\android.jar")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $platformProbe) {
            & $androidCli sdk install "platforms/android-37.0" | Out-Host
            $platformProbe = @(
              (Join-Path $sdk "platforms\android-37.0\android.jar"),
              (Join-Path $sdk "platforms\android-37\android.jar")
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $platformProbe) { throw "Android API 37 platform android.jar is missing" }
          Write-Host "Android API 37 platform present: $platformProbe"

          Ensure-AndroidComponent -Name "Build Tools 37.0.0" -Probe (Join-Path $sdk "build-tools\37.0.0\aapt2.exe") -AndroidCliPackage "build-tools/37.0.0"
          Ensure-AndroidComponent -Name "Platform Tools" -Probe (Join-Path $sdk "platform-tools\adb.exe") -AndroidCliPackage "platform-tools"
          Ensure-AndroidComponent -Name "Android Emulator" -Probe (Join-Path $sdk "emulator\emulator.exe") -AndroidCliPackage "emulator"

          $systemImageDir = Join-Path $sdk "system-images\android-35\google_apis\x86_64"
          $systemImageProbe = Join-Path $systemImageDir "package.xml"
          if (-not (Test-Path $systemImageProbe)) {
            Write-Host "Installing missing API 35 Google APIs x86_64 system image with sdkmanager."
            1..50 | ForEach-Object { "y" } | & $sdkManager "system-images;android-35;google_apis;x86_64" | Out-Host
            if (-not (Test-Path $systemImageProbe)) {
              throw "API 35 Google APIs x86_64 system image is still missing: $systemImageDir"
            }
          }

          Write-Host "Android SDK package verification: GREEN"
          Write-Host "Platform: $platformProbe"
          Write-Host "Build tools: $(Join-Path $sdk 'build-tools\37.0.0')"
          Write-Host "Emulator: $(Join-Path $sdk 'emulator\emulator.exe')"
          Write-Host "System image: $systemImageDir"
      - name: Start deterministic API 35 profile emulator
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if (-not $sdk) { throw "ANDROID_SDK_ROOT/ANDROID_HOME is not set" }

          $avdManager = Join-Path $sdk "cmdline-tools\latest\bin\avdmanager.bat"
          $adb = Join-Path $sdk "platform-tools\adb.exe"
          $emulatorExe = Join-Path $sdk "emulator\emulator.exe"

          $stdout = Join-Path $env:TEMP "veil-profile-emulator.stdout.log"
          $stderr = Join-Path $env:TEMP "veil-profile-emulator.stderr.log"

          # Never reuse or terminate a user-owned emulator.
          $serial = "emulator-5580"
          $devices = @(& $adb devices)
          if ($LASTEXITCODE -ne 0) { throw "Cannot inventory ADB devices" }
          if ($devices -match '^emulator-5580\s') { throw "Profile emulator port 5580 is already occupied" }
          $avdName = "VeilReleaseProfile_$($env:GITHUB_RUN_ID)_$($env:GITHUB_RUN_ATTEMPT)"
          "VEIL_PROFILE_AVD=$avdName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VEIL_PROFILE_SERIAL=$serial" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_SERIAL=$serial" | Out-File -FilePath $env:GITHUB_ENV -Append

          $avdHome = "E:\VeilReader-CI\avd"
          New-Item -ItemType Directory -Force -Path $avdHome | Out-Null
          $env:ANDROID_AVD_HOME = $avdHome
          "ANDROID_AVD_HOME=$avdHome" | Out-File -FilePath $env:GITHUB_ENV -Append

          $ini = Join-Path $avdHome "$avdName.ini"
          $avdDir = Join-Path $avdHome "$avdName.avd"
          if ((Test-Path $ini) -or (Test-Path $avdDir)) { throw "Preserve existing AVD; use a fresh run attempt: $avdName" }

          "no" | & $avdManager create avd --force --name $avdName --package "system-images;android-35;google_apis;x86_64" --device "pixel_6" | Out-Host
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $avdDir)) {
            throw "Failed to create dedicated AVD under $avdHome"
          }

          $configIni = Join-Path $avdDir "config.ini"
          if (-not (Test-Path $configIni)) { throw "AVD config.ini not found: $configIni" }

          $configLines = @(Get-Content $configIni) | Where-Object {
            $_ -notmatch '^disk\.dataPartition\.size=' -and
            $_ -notmatch '^disk\.cachePartition\.size=' -and
            $_ -notmatch '^sdcard\.size='
          }
          $configLines += "disk.dataPartition.size=2048M"
          $configLines += "disk.cachePartition.size=128M"
          $configLines += "sdcard.size=256M"
          Set-Content -Path $configIni -Value $configLines -Encoding ASCII

          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue

          Write-Host "=== Emulator acceleration check ==="
          & $emulatorExe -accel-check 2>&1 | Out-Host

          # Pin the ADB console port so polling is deterministic.
          $args = @(
            "-avd",$avdName,
            "-port","5580",
            "-no-window",
            "-no-audio",
            "-no-boot-anim",
            "-no-snapshot",
            "-no-metrics",
            "-gpu","swiftshader_indirect",
            "-cores","2",
            "-memory","1536"
          )

          Start-Process -FilePath $emulatorExe -ArgumentList $args -RedirectStandardOutput $stdout -RedirectStandardError $stderr | Out-Null

          $serial = "emulator-5580"
          $deadline = (Get-Date).AddMinutes(3)
          do {
            if ((Get-Date) -gt $deadline) {
              Write-Host "=== adb devices ==="
              $previousPreference = $ErrorActionPreference
              $ErrorActionPreference = "SilentlyContinue"
              & $adb devices -l 2>&1 | Out-Host
              $ErrorActionPreference = $previousPreference

              if (Test-Path $stdout) {
                Write-Host "=== emulator stdout ==="
                Get-Content $stdout -Tail 250 | Out-Host
              }
              if (Test-Path $stderr) {
                Write-Host "=== emulator stderr ==="
                Get-Content $stderr -Tail 250 | Out-Host
              }
              throw "Emulator did not become ADB-ready within 3 minutes"
            }

            $previousPreference = $ErrorActionPreference
            $ErrorActionPreference = "SilentlyContinue"
            $state = (& $adb -s $serial get-state 2>&1 | Select-Object -Last 1).ToString().Trim()
            $ErrorActionPreference = $previousPreference

            if ($state -eq "device") {
              $previousPreference = $ErrorActionPreference
              $ErrorActionPreference = "SilentlyContinue"
              $boot = (& $adb -s $serial shell getprop sys.boot_completed 2>&1 | Select-Object -Last 1).ToString().Trim()
              $ErrorActionPreference = $previousPreference
              if ($boot -eq "1") { break }
            }

            Start-Sleep -Seconds 2
          } while ($true)

          "VEIL_PROFILE_SERIAL=$serial" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Profile emulator boot: GREEN ($serial)"

      - name: Set up Gradle 9.6
        if: steps.superseded.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Generate Baseline and Startup Profile
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          gradle :app:generateBaselineProfile -Pveil.profile.connected=true --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Baseline Profile generation failed" }

          $profiles = Get-ChildItem "app\src" -Recurse -File | Where-Object {
            $_.FullName -match "generated\\baselineProfiles" -and
            ($_.Name -eq "baseline-prof.txt" -or $_.Name -eq "startup-prof.txt")
          }

          if (-not $profiles) {
            throw "Baseline Profile task completed but produced no source profile under app/src/**/generated/baselineProfiles"
          }

          $profiles | ForEach-Object {
            if ($_.Length -le 0) { throw "Generated profile is empty: $($_.FullName)" }
            Write-Host "Generated profile: $($_.FullName) ($($_.Length) bytes)"
          }

      - name: Preserve generated profile sources for review
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $destination = Join-Path $env:VEIL_CI_ROOT "profiles\$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $profiles = @(Get-ChildItem "app\src" -Recurse -File | Where-Object {
            $_.FullName -match "generated\\baselineProfiles" -and $_.Name -in @("baseline-prof.txt", "startup-prof.txt")
          })
          foreach ($profile in $profiles) {
            $relative = (Resolve-Path -LiteralPath $profile.FullName -Relative)
            $target = Join-Path $destination $relative
            New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
            Copy-Item -LiteralPath $profile.FullName -Destination $target
            Write-Host "Profile evidence: $target bytes=$($profile.Length) sha256=$((Get-FileHash $target -Algorithm SHA256).Hash)"
          }

      - name: Upload generated profiles for review
        if: steps.superseded.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-profile-sources-${{ github.run_id }}
          path: app/src/**/generated/baselineProfiles/*.txt
          if-no-files-found: error
          retention-days: 3

      - name: Verify generated profiles match committed sources
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $profiles = @(Get-ChildItem "app\src" -Recurse -File | Where-Object {
            $_.FullName -match "generated\\baselineProfiles" -and
            ($_.Name -eq "baseline-prof.txt" -or $_.Name -eq "startup-prof.txt")
          })

          foreach ($required in @("baseline-prof.txt", "startup-prof.txt")) {
            if (-not ($profiles | Where-Object { $_.Name -eq $required -and $_.Length -gt 0 })) {
              throw "Expected non-empty generated profile: $required"
            }
          }

          foreach ($profile in $profiles) {
            $relative = (Resolve-Path -LiteralPath $profile.FullName -Relative).Replace("\","/")
            git ls-files --error-unmatch -- "$relative" *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Generated profile is not committed to git: $relative"
            }
            if ($profile.Length -le 0) {
              throw "Generated profile is empty: $relative"
            }
            Write-Host "Committed generated profile: $relative ($($profile.Length) bytes)"
          }

          git diff --exit-code -- app/src
          if ($LASTEXITCODE -ne 0) {
            throw "Generated profile differs from committed source. Refresh and review profiles before release verification."
          }

      - name: Stop owned profile emulator before release packaging
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          & ".\tools\stop_ci_profile_emulator.ps1"

      - name: Release packaging disk-space gate
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:VEIL_CI_SCRATCH_DRIVE) { throw "VEIL_CI_SCRATCH_DRIVE is not set" }

          $scratch = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Where-Object { $_.DeviceID -eq $env:VEIL_CI_SCRATCH_DRIVE } |
            Select-Object -First 1
          if (-not $scratch) { throw "Could not resolve CI scratch drive $env:VEIL_CI_SCRATCH_DRIVE" }
          $freeGB = [int64]$scratch.FreeSpace / 1GB
          Write-Host ("Release packaging E: free={0:N2} GB" -f $freeGB)
          if ($freeGB -lt 12) { throw ("Release packaging requires >=12 GB on E:, found {0:N2} GB" -f $freeGB) }


      - name: Build release APK and AAB
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Audit merged release manifest
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $manifests = @(Get-ChildItem "app\build\intermediates" -Recurse -Filter "AndroidManifest.xml" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\release\\" })

          if (-not $manifests) { throw "No merged release AndroidManifest.xml found" }

          $manifest = $manifests | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Write-Host "Merged release manifest: $($manifest.FullName)"
          $content = Get-Content $manifest.FullName -Raw
          $content | Out-File -FilePath "release-merged-manifest.xml" -Encoding utf8

          if ($content -match 'android.permission.INTERNET') {
            throw "Offline contract regression: release manifest requests INTERNET"
          }

          Write-Host "Release manifest offline contract: GREEN"


      - name: Verify release Baseline Profile packaging
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: python tools/verify_release_profile.py

      - name: Record release evidence
        if: success() && steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $head = (git rev-parse HEAD).Trim()
          "verified_commit=$head" | Out-File -FilePath release-evidence.txt -Encoding utf8

          $artifacts = @()
          $artifacts += @(Get-ChildItem "app\build\outputs\apk\release" -Filter "*.apk" -File -ErrorAction SilentlyContinue)
          $artifacts += @(Get-ChildItem "app\build\outputs\bundle\release" -Filter "*.aab" -File -ErrorAction SilentlyContinue)
          $artifacts += @(Get-ChildItem "app\src" -Recurse -File | Where-Object { $_.FullName -match "generated\\baselineProfiles" })

          if (-not $artifacts) { throw "No release/profile artifacts found for evidence capture" }

          foreach ($artifact in $artifacts) {
            $hash = Get-FileHash -Algorithm SHA256 $artifact.FullName
            $relative = Resolve-Path -Relative $artifact.FullName
            "$relative sha256=$($hash.Hash.ToLowerInvariant()) bytes=$($artifact.Length)" |
              Out-File -FilePath release-evidence.txt -Append -Encoding utf8
          }

          Get-Content release-evidence.txt

      - name: Upload verified release evidence
        if: success() && steps.superseded.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-release-hardening-${{ github.run_id }}
          path: |
            release-evidence.txt
            release-merged-manifest.xml
            app/src/**/generated/baselineProfiles/*.txt
          if-no-files-found: error
          retention-days: 3

      - name: Stop profile emulator
        if: always() && steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          & ".\tools\stop_ci_profile_emulator.ps1"
