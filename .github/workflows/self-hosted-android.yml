name: Self-hosted Android Verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to verify"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: reader-release-hardening-v2
  # Cancel stale/manual pushes so an offline runner cannot accumulate a blocking queue.
  # The workflow's own profile commit is authored by github-actions[bot]; do not let
  # that follow-up push cancel the run that is still producing release evidence.
  cancel-in-progress: ${{ github.event_name == 'push' && github.actor != 'github-actions[bot]' }}

jobs:
  windows-verify:
    runs-on: [self-hosted, Windows, X64, veil-reader]
    timeout-minutes: 45
    steps:
      - name: Checkout requested ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout triggering ref
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Skip superseded push run
        if: github.event_name == 'push'
        id: superseded
        shell: powershell
        run: |
          $remote = (git ls-remote origin refs/heads/release/reader-hardening-rc).Split()[0]
          if (-not $remote) { throw "Could not resolve remote hardening branch tip" }
          if ($remote -ne $env:GITHUB_SHA) {
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Superseded run: $env:GITHUB_SHA; current branch tip is $remote"
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Set up JDK 17
        if: steps.superseded.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.superseded.outputs.skip != 'true'
        uses: android-actions/setup-android@v4

      - name: Install Android platform, emulator and build tools
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          android sdk install "platforms/android-37.0"
          android sdk install "build-tools/37.0.0"
          android sdk install "platform-tools"
          android sdk install "emulator"
          android sdk install "system-images;android-35;google_apis;x86_64"

      - name: Start deterministic API 35 profile emulator
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if (-not $sdk) { throw "ANDROID_SDK_ROOT/ANDROID_HOME is not set" }

          $avdName = "VeilReleaseProfile_API35"
          $avdHome = Join-Path $env:USERPROFILE ".android\avd"
          $ini = Join-Path $avdHome "$avdName.ini"

          if (-not (Test-Path $ini)) {
            "no" | & "$sdk\cmdline-tools\latest\bin\avdmanager.bat" create avd --force --name $avdName --package "system-images;android-35;google_apis;x86_64" --device "pixel_6"
          }

          & "$sdk\platform-tools\adb.exe" kill-server | Out-Null
          & "$sdk\platform-tools\adb.exe" start-server | Out-Null

          $args = @("-avd",$avdName,"-no-window","-no-audio","-no-boot-anim","-no-snapshot","-gpu","swiftshader_indirect","-wipe-data")
          $emulator = Start-Process -FilePath "$sdk\emulator\emulator.exe" -ArgumentList $args -PassThru
          "VEIL_EMULATOR_PID=$($emulator.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append

          & "$sdk\platform-tools\adb.exe" wait-for-device
          $deadline = (Get-Date).AddMinutes(5)
          do {
            if ((Get-Date) -gt $deadline) { throw "Emulator boot timed out" }
            Start-Sleep -Seconds 2
            $boot = (& "$sdk\platform-tools\adb.exe" shell getprop sys.boot_completed 2>$null).Trim()
          } until ($boot -eq "1")

          & "$sdk\platform-tools\adb.exe" shell settings put global window_animation_scale 0
          & "$sdk\platform-tools\adb.exe" shell settings put global transition_animation_scale 0
          & "$sdk\platform-tools\adb.exe" shell settings put global animator_duration_scale 0
          & "$sdk\platform-tools\adb.exe" devices -l

      - name: Reading policy regression checks
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: '& "$env:ProgramFiles\Git\bin\bash.exe" tools/test-policy.sh'

      - name: Performance budget parser checks
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          python tools/test_performance_budget.py
          python tools/test_performance_delta.py
          python tools/test_performance_dashboard.py

      - name: Set up Gradle 9.6
        if: steps.superseded.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Generate Baseline and Startup Profile
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          gradle :app:generateBaselineProfile --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Baseline Profile generation failed" }

          $profiles = Get-ChildItem "app\src" -Recurse -File | Where-Object {
            $_.FullName -match "generated\\baselineProfiles" -and
            ($_.Name -eq "baseline-prof.txt" -or $_.Name -eq "startup-prof.txt")
          }

          if (-not $profiles) {
            throw "Baseline Profile task completed but produced no source profile under app/src/**/generated/baselineProfiles"
          }

          $profiles | ForEach-Object {
            if ($_.Length -le 0) { throw "Generated profile is empty: $($_.FullName)" }
            Write-Host "Generated profile: $($_.FullName) ($($_.Length) bytes)"
          }

      - name: Commit generated Baseline Profile to hardening branch
        if: steps.superseded.outputs.skip != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/release/reader-hardening-rc'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git add -- "app/src/**/generated/baselineProfiles/*.txt"

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Generated Baseline Profile is already committed."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf(release): commit generated Baseline Profile"
          git push origin HEAD:release/reader-hardening-rc

      - name: Unit tests
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Verify committed Room schema
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: git diff --exit-code -- app/schemas/

      - name: Android lint
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: gradle :app:assembleDebug --stacktrace

      - name: Compile performance harness
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: gradle :benchmark:assembleBenchmarkBenchmark --stacktrace

      - name: Build release APK and AAB
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify release Baseline Profile packaging
        if: steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: python tools/verify_release_profile.py

      - name: Record release evidence
        if: success() && steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $head = (git rev-parse HEAD).Trim()
          "verified_commit=$head" | Out-File -FilePath release-evidence.txt -Encoding utf8

          $artifacts = @()
          $artifacts += @(Get-ChildItem "app\build\outputs\apk\release" -Filter "*.apk" -File -ErrorAction SilentlyContinue)
          $artifacts += @(Get-ChildItem "app\build\outputs\bundle\release" -Filter "*.aab" -File -ErrorAction SilentlyContinue)
          $artifacts += @(Get-ChildItem "app\src" -Recurse -File | Where-Object { $_.FullName -match "generated\\baselineProfiles" })

          if (-not $artifacts) { throw "No release/profile artifacts found for evidence capture" }

          foreach ($artifact in $artifacts) {
            $hash = Get-FileHash -Algorithm SHA256 $artifact.FullName
            $relative = Resolve-Path -Relative $artifact.FullName
            "$relative sha256=$($hash.Hash.ToLowerInvariant()) bytes=$($artifact.Length)" |
              Out-File -FilePath release-evidence.txt -Append -Encoding utf8
          }

          Get-Content release-evidence.txt

      - name: Upload verified release evidence
        if: success() && steps.superseded.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-release-hardening-${{ github.run_id }}
          path: |
            release-evidence.txt
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/src/**/generated/baselineProfiles/*.txt
          if-no-files-found: error
          retention-days: 7

      - name: Stop profile emulator
        if: always() && steps.superseded.outputs.skip != 'true'
        shell: powershell
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if ($sdk) {
            & "$sdk\platform-tools\adb.exe" emu kill 2>$null
          }
