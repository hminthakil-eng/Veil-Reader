name: Dependency Governance

on:
  pull_request:
    paths:
      - "app/**"
      - "benchmark/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "tools/cyclonedx-init.gradle.kts"
      - ".github/dependency-review-config.yml"
      - ".github/workflows/dependency-governance.yml"
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "benchmark/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "tools/cyclonedx-init.gradle.kts"
      - ".github/dependency-review-config.yml"
      - ".github/workflows/dependency-governance.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-graph:
    name: dependency-graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate and submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph: generate-and-submit
          cache-provider: basic

      - name: Generate CycloneDX aggregate SBOM
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Produce CycloneDX JSON/XML
        run: gradle cyclonedxBom --init-script tools/cyclonedx-init.gradle.kts --stacktrace

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-sbom-${{ github.sha }}
          path: |
            build/reports/cyclonedx/bom.json
            build/reports/cyclonedx/bom.xml
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    needs: dependency-graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependency delta
        uses: actions/dependency-review-action@v5
        with:
          config-file: ./.github/dependency-review-config.yml
