name: Performance Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate profile and run benchmark smoke
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :app:generateBaselineProfile --stacktrace
            gradle :benchmark:connectedBenchmarkAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR

      - name: Enforce emulator smoke budgets
        run: python3 tools/check_performance_budget.py --mode smoke benchmark/build

      - name: Upload benchmark traces and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veil-reader-performance-smoke
          path: |
            benchmark/build/outputs/
            benchmark/build/reports/
            app/src/**/generated/baselineProfiles/
          if-no-files-found: warn
          retention-days: 7

      # Emulator metrics are useful as a regression smoke signal only. Device-grade performance
      # decisions must be based on the same Macrobenchmarks run on a representative physical device.
