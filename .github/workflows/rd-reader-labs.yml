name: Reader R&D Labs

on:
  push:
    branches:
      - "rd/**"
    paths:
      - "rd-reader-labs/**"
      - "research/rd/**"
      - "settings.gradle.kts"
      - ".github/workflows/rd-reader-labs.yml"
  pull_request:
    paths:
      - "rd-reader-labs/**"
      - "research/rd/**"
      - "settings.gradle.kts"
      - ".github/workflows/rd-reader-labs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-rd-labs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Compile and test isolated reader labs
        run: gradle :rd-reader-labs:test --stacktrace

      - name: Prove app has no dependency on labs
        run: |
          if grep -R --line-number --fixed-string 'rd-reader-labs' app/build.gradle.kts app/src 2>/dev/null; then
            echo "::error::Production app must not depend on R&D labs."
            exit 1
          fi
