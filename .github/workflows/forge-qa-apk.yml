name: Forge QA APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-qa-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORG_GRADLE_PROJECT_veilForgeQa: 'true'
      ORG_GRADLE_PROJECT_veilForgeRevision: ${{ github.sha }}
      VEIL_TEST_APPLICATION_ID: com.veilreader.app.forgeqa
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Dedicated debug QA key, never production signing. Cache scope is this QA branch.
      - name: Retain QA update signing identity
        uses: actions/cache@v4
        with:
          path: .forge-qa/debug.keystore
          key: veil-forge-qa-debug-signing-v1

      - name: Prepare non-production QA key on first build
        run: |
          if [ ! -f .forge-qa/debug.keystore ]; then
            if [ -f quality/forge-qa-signing-cert.sha256 ]; then
              echo "::error::The pinned QA signing key is unavailable. Recover its cache before building an update; generating another key would break installed QA updates."
              exit 1
            fi
            mkdir -p .forge-qa
            keytool -genkeypair -keystore .forge-qa/debug.keystore -storetype JKS \
              -storepass android -keypass android -alias AndroidDebugKey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Veil Forge QA,O=Veil Reader QA,C=US"
          fi

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Test, lint and build the separate QA installation
        run: >-
          gradle :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin
          :app:lintDebug :app:assembleDebug
          -PveilForgeQa=true -PveilForgeRevision="${GITHUB_SHA}" --stacktrace

      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify QA installation on Android
        run: bash tools/run_android_ci_emulator.sh storage

      - name: Verify QA identity, signature and artifact hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/forge-qa
          QA_APK="build/forge-qa/VeilReader-ForgeQA-${GITHUB_SHA:0:8}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$QA_APK"
          QA_APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$QA_APKSIGNER" verify --verbose --print-certs "$QA_APK" > build/forge-qa/SIGNATURE.txt
          "$(dirname "$QA_APKSIGNER")/aapt" dump badging "$QA_APK" > build/forge-qa/APK-METADATA.txt
          python3 - <<'PY'
          from pathlib import Path
          metadata = Path('build/forge-qa/APK-METADATA.txt').read_text()
          assert "package: name='com.veilreader.app.forgeqa'" in metadata
          assert "application-label:'Veil Reader Forge QA'" in metadata
          assert "versionName='0.10.0-forge-" in metadata
          pin = Path('quality/forge-qa-signing-cert.sha256')
          if pin.exists():
              signature = Path('build/forge-qa/SIGNATURE.txt').read_text()
              prefix = 'Signer #1 certificate SHA-256 digest:'
              actual = next(line[len(prefix):].strip().lower() for line in signature.splitlines() if line.startswith(prefix))
              assert actual == pin.read_text().strip().lower(), 'QA signer does not match pinned update identity'
          PY
          printf 'source=%s\nrun=%s\npackage=com.veilreader.app.forgeqa\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > build/forge-qa/BUILD.txt
          (cd build/forge-qa && sha256sum "VeilReader-ForgeQA-${GITHUB_SHA:0:8}.apk" > SHA256SUMS)

      - name: Upload installable QA APK and identity evidence
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-forge-qa-apk
          path: build/forge-qa/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve QA unit and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-forge-qa-verification
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/lint-results-debug.xml
            app/build/outputs/androidTest-results/connected/debug/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 14
