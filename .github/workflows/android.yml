name: Android CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "benchmark/**"
      - "performance/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "buildSrc/**"
      - "tools/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [ "grand-forge/tts-neural-shared-assets-hardening-v1", "grand-forge/tts-listening-mode-v1", "grand-forge/arena-app-hardening-v1", "integration/page-engine-canonical-v1", "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Reading policy regression checks
        run: sh tools/test-policy.sh

      - name: Canonical Paper source and guard regression checks
        run: |
          sh tools/verify-canonical-paper.sh
          python3 tools/test_canonical_paper_guard.py

      - name: Performance budget parser checks
        run: |
          python3 tools/test_performance_budget.py
          python3 tools/test_performance_delta.py
          python3 tools/test_performance_dashboard.py
          python3 tools/test_release_artifact.py

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compile accessibility instrumentation regressions
        run: gradle :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Verify committed Room schema
        run: |
          schema_status="$(git status --porcelain --untracked-files=all -- app/schemas/)"
          if [ -n "$schema_status" ]; then
            echo "::error::Room schema history is not fully committed."
            printf '%s\n' "$schema_status"
            exit 1
          fi

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build optimized release artifacts
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify optimized release archives
        run: |
          python3 tools/verify_release_artifact.py             app/build/outputs/apk/release/app-release-unsigned.apk             app/build/outputs/bundle/release/app-release.aab

      - name: Compile performance harness
        run: gradle :benchmark:assembleBenchmarkBenchmark --stacktrace

      - name: Upload APK for manual runs only
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload verification reports on failure only
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-verification
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 1

      - name: Preserve exact unit and lint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veil-reader-source-verification
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7
