name: Android CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "benchmark/**"
      - "performance/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "buildSrc/**"
      - "tools/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "benchmark/**"
      - "performance/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "buildSrc/**"
      - "tools/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reading policy regression checks
        run: sh tools/test-policy.sh

      - name: Performance budget parser checks
        run: |
          python3 tools/test_performance_budget.py
          python3 tools/test_performance_delta.py
          python3 tools/test_performance_dashboard.py

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Verify committed Room schema
        run: git diff --exit-code -- app/schemas/

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Compile performance harness
        run: gradle :benchmark:assembleBenchmark --stacktrace

      - name: Upload APK for manual runs only
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: veil-reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload verification reports on failure only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: veil-reader-verification
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 1
