name: Restore exact base dependency snapshot

on:
  push:
    branches: ["diagnostics/reader-toolchain-20261020-558"]

permissions:
  contents: read
  actions: write

jobs:
  dispatch-existing-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify canonical base and dispatch existing trusted workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual_base="$(gh api repos/hminthakil-eng/Veil-Reader/git/ref/heads/main --jq '.object.sha')"
          test "$actual_base" = "811f0d7d521fc11f110638a100c315f698d52fd5"
          gh api --method POST repos/hminthakil-eng/Veil-Reader/actions/workflows/dependency-baseline.yml/dispatches -f ref=main
          echo "Dispatched existing Dependency Baseline workflow after verifying main=811f0d7d521fc11f110638a100c315f698d52fd5"
