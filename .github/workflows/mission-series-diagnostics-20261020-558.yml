name: Series picker diagnostics (temporary)

on:
  pull_request:
    paths:
      - ".github/workflows/mission-series-diagnostics-20261020-558.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect-owned-report:
    if: github.event.pull_request.number == 558
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify exact source report and print failing interaction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, subprocess, zipfile
          import xml.etree.ElementTree as ET
          repo = "hminthakil-eng/Veil-Reader"
          artifact = "12301566211"
          expected_head = "f974afa659549a323147e5af01a80e0a4d54064c"
          expected_digest = "ad1c09ab23b98de9cc5efee3cadff18027244c8d259f573460cd2feb078b750a"
          def api(path):
              return subprocess.run(["gh", "api", path], check=True, capture_output=True).stdout
          metadata = json.loads(api(f"/repos/{repo}/actions/artifacts/{artifact}"))
          assert metadata["workflow_run"]["head_sha"] == expected_head
          assert metadata["workflow_run"]["id"] == 39500725015
          assert metadata["size_in_bytes"] < 2_000_000
          payload = api(f"/repos/{repo}/actions/artifacts/{artifact}/zip")
          assert hashlib.sha256(payload).hexdigest() == expected_digest
          print("VERIFIED source:", expected_head, "artifact:", artifact, "sha256:", expected_digest)
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              target = [n for n in archive.namelist() if n.endswith("TEST-com.veilreader.app.ui.screens.LibraryRetrievalInteractionTest.xml")]
              assert len(target) == 1, target
              root = ET.fromstring(archive.read(target[0]))
              print("SUITE:", root.attrib)
              for case in root.findall("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      print("FAILED:", case.attrib)
                      print("MESSAGE:", failure.attrib.get("message", ""))
                      print((failure.text or "")[:16000])
          PY
