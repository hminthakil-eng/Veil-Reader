name: Dependency Review

on:
  pull_request:
    branches: [ "grand-forge/p0-kindle-reader-quality-20261008", "grand-forge/tts-listening-mode-v1", "grand-forge/arena-app-hardening-v1", "integration/page-engine-canonical-v1", "main" ]
permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependency delta
        uses: actions/dependency-review-action@v5
        with:
          config-file: ./.github/dependency-review-config.yml
