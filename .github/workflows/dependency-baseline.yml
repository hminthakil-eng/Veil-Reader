name: Dependency Baseline

on:
  pull_request:
    branches: [ "grand-forge/p0-kindle-reader-quality-20261008", "grand-forge/tts-listening-mode-v1", "grand-forge/arena-app-hardening-v1", "integration/page-engine-canonical-v1", "main" ]
  push:
    branches: [ "grand-forge/p0-kindle-reader-quality-20261008", "grand-forge/arena-app-hardening-v1", "main" ]
    paths:
      - "app/**"
      - "benchmark/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-baseline.yml"
  workflow_dispatch:

# PR sources must never have a write-permission token solely for scanning.
permissions:
  contents: read

concurrency:
  group: dependency-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-source-sbom:
    name: pr-source-sbom
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # A source-tree inventory is NOT an authoritative resolved Gradle graph.
      - name: Generate PR source inventory in CycloneDX JSON
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: cyclonedx-json
          output-file: pr-source-inventory.cdx.json
          artifact-name: veil-reader-pr-source-inventory-${{ github.sha }}
          syft-version: v1.54.0
          upload-artifact-retention: 14
          upload-release-assets: false

  dependency-graph:
    name: dependency-graph
    if: github.event_name != 'pull_request'
    # The upload requires contents:write; the PR job cannot inherit this.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate and submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph: generate-and-submit
          cache-provider: basic

      - name: Prepare SBOM output
        run: mkdir -p build/reports/sbom

      - name: Generate CycloneDX JSON SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: cyclonedx-json
          output-file: build/reports/sbom/veil-reader.cdx.json
          artifact-name: veil-reader-cyclonedx-json-${{ github.sha }}
          syft-version: v1.54.0
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Generate CycloneDX XML SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: cyclonedx-xml
          output-file: build/reports/sbom/veil-reader.cdx.xml
          artifact-name: veil-reader-cyclonedx-xml-${{ github.sha }}
          syft-version: v1.54.0
          upload-artifact-retention: 14
          upload-release-assets: false
