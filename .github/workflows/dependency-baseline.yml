name: Dependency Baseline

on:
  pull_request:
    branches: [ "grand-forge/tts-listening-mode-v1", "grand-forge/arena-app-hardening-v1", "integration/page-engine-canonical-v1", "main" ]
  push:
    branches: [ "grand-forge/arena-app-hardening-v1", "main" ]
    paths:
      - "app/**"
      - "benchmark/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: dependency-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-graph:
    name: dependency-graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable dependency source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source identity
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate and submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@v6
        env:
          GITHUB_DEPENDENCY_GRAPH_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_DEPENDENCY_GRAPH_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
        with:
          dependency-graph: generate-and-submit
          cache-provider: basic

      - name: Assert snapshot SHA, ref and nonempty manifests
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          reports = list(Path('dependency-graph-reports').glob('*.json'))
          if len(reports) != 1:
              raise SystemExit(f'Expected exactly one Gradle snapshot, got {len(reports)}')
          snapshot = json.loads(reports[0].read_text(encoding='utf-8'))
          for key, expected in [('sha', os.environ['EXPECTED_SHA']), ('ref', os.environ['EXPECTED_REF'])]:
              if snapshot.get(key) != expected:
                  raise SystemExit(f'Snapshot {key} mismatch: {snapshot.get(key)!r} != {expected!r}')
          if not snapshot.get('manifests'):
              raise SystemExit('Dependency snapshot has no manifests')
          print('Exact dependency snapshot identity and manifests verified')
          PY

      # Serial review avoids the independently observed cross-workflow snapshot race.
      - name: Review submitted dependency graph
        if: ${{ github.event_name == 'pull_request' }}
        id: review
        uses: actions/dependency-review-action@v5
        with:
          config-file: ./.github/dependency-review-config.yml
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

      - name: Fail closed on missing or warning-bearing comparison
        if: ${{ always() && github.event_name == 'pull_request' && steps.review.outcome == 'success' }}
        env:
          REVIEW_SUMMARY: ${{ steps.review.outputs.comment-content }}
        run: |
          python3 - <<'PY'
          import os, re
          summary = os.environ.get('REVIEW_SUMMARY', '')
          def valid(value):
              return bool(re.search(r'<h1(?:\s[^>]*)?>\s*Dependency Review\s*</h1>', value, re.I)) and not bool(re.search(r'<h2(?:\s[^>]*)?>\s*Snapshot Warnings\s*</h2>', value, re.I))
          assert not valid('')
          assert not valid('<h2>Unrelated</h2>')
          assert not valid('<h1>Dependency Review</h1><h2>Snapshot Warnings</h2>')
          assert valid('<h1>Dependency Review</h1><p>Clean comparison</p>')
          if not valid(summary):
              raise SystemExit('::error::Dependency comparison missing, malformed or has snapshot warnings')
          print('Warning-free sequential dependency review verified')
          PY

      - name: Prepare SBOM output
        run: mkdir -p build/reports/sbom

      - name: Generate CycloneDX JSON SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: cyclonedx-json
          output-file: build/reports/sbom/veil-reader.cdx.json
          artifact-name: veil-reader-cyclonedx-json-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          syft-version: v1.54.0
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Generate CycloneDX XML SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: cyclonedx-xml
          output-file: build/reports/sbom/veil-reader.cdx.xml
          artifact-name: veil-reader-cyclonedx-xml-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          syft-version: v1.54.0
          upload-artifact-retention: 14
          upload-release-assets: false
