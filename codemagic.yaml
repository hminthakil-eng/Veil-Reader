workflows:
  veil-reader-release-hardening:
    name: Veil Reader Release Hardening — Cloud Pilot
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'ci/codemagic-release-pilot'
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      java: 17
    scripts:
      - name: Configure Android SDK and Gradle
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK root not found: $SDK_ROOT" >&2
            exit 1
          fi

          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"
          echo "sdk.dir=$SDK_ROOT" > local.properties

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found: $SDKMANAGER" >&2
            exit 1
          fi

          echo "=== Android SDK ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          "$SDKMANAGER" --version

          echo "=== Resolve Android 17 / API 37 package ==="
          SDK_LIST="$("$SDKMANAGER" --list --channel=3)"
          PLATFORM_37="$(printf '%s\n' "$SDK_LIST" | awk -F'|' '
            /^[[:space:]]*platforms;android-37(\.0)?[[:space:]]*\|/ {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit
            }')"

          if [ -z "$PLATFORM_37" ]; then
            echo "No Android 17 platform package found. Available API 37 candidates:" >&2
            printf '%s\n' "$SDK_LIST" | grep -E 'platforms;android-37|build-tools;37' || true
            exit 1
          fi

          echo "Resolved platform package: $PLATFORM_37"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3             "$PLATFORM_37"             "build-tools;37.0.0"             "platform-tools"             "emulator"             "system-images;android-35;default;arm64-v8a"

          echo "=== Required SDK packages installed ==="
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-37|build-tools;37\.0\.0|system-images;android-35;default;arm64-v8a|platform-tools' || true

          if [ ! -x "$CM_BUILD_DIR/gradlew" ]; then
            GRADLE_VERSION="9.6.0"
            GRADLE_HOME="$CM_BUILD_DIR/.gradle-dist/gradle-$GRADLE_VERSION"
            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
              mkdir -p "$CM_BUILD_DIR/.gradle-dist"
              curl --fail --location --retry 3                 "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"                 --output "$CM_BUILD_DIR/.gradle-dist/gradle.zip"
              unzip -q "$CM_BUILD_DIR/.gradle-dist/gradle.zip" -d "$CM_BUILD_DIR/.gradle-dist"
            fi
            cat > "$CM_BUILD_DIR/gradlew" <<'EOF'
          #!/bin/sh
          exec "$CM_BUILD_DIR/.gradle-dist/gradle-9.6.0/bin/gradle" "$@"
          EOF
            chmod +x "$CM_BUILD_DIR/gradlew"
          fi

          ./gradlew --version

      - name: Policy and performance parser checks
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          sh tools/test-policy.sh
          python3 tools/test_performance_budget.py
          python3 tools/test_performance_delta.py
          python3 tools/test_performance_dashboard.py

      - name: Generate Baseline and Startup Profile on connected ARM64 emulator
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"

          AVD_NAME="VeilProfile_API35"
          echo "no" | avdmanager create avd --force             --name "$AVD_NAME"             --package "system-images;android-35;default;arm64-v8a"             --device "pixel_6"

          adb kill-server || true
          adb start-server

          nohup emulator             -avd "$AVD_NAME"             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             -memory 2048             > "$CM_BUILD_DIR/emulator-release-profile.log" 2>&1 &
          EMULATOR_PID=$!

          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          adb wait-for-device
          deadline=$((SECONDS + 360))
          while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Emulator boot timed out" >&2
              adb devices -l || true
              tail -250 "$CM_BUILD_DIR/emulator-release-profile.log" || true
              exit 1
            fi
            sleep 2
          done

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb devices -l

          set +e
          ./gradlew :app:generateBaselineProfile             -Pveil.profile.connected=true             --stacktrace --info 2>&1 | tee "$CM_BUILD_DIR/profile-generation.log"
          GRADLE_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$GRADLE_STATUS" -ne 0 ]; then
            echo "Baseline Profile generation failed with status $GRADLE_STATUS" >&2
            tail -250 "$CM_BUILD_DIR/profile-generation.log" || true
            exit "$GRADLE_STATUS"
          fi

          BASELINE="$(find app/src -type f -path '*/generated/baselineProfiles/baseline-prof.txt' -print -quit)"
          STARTUP="$(find app/src -type f -path '*/generated/baselineProfiles/startup-prof.txt' -print -quit)"

          test -n "$BASELINE"
          test -n "$STARTUP"
          test -s "$BASELINE"
          test -s "$STARTUP"

          echo "Generated Baseline Profile: $BASELINE ($(wc -c < "$BASELINE" | tr -d ' ') bytes)"
          echo "Generated Startup Profile: $STARTUP ($(wc -c < "$STARTUP" | tr -d ' ') bytes)"
          git status --short -- app/src

      - name: Unit tests
        script: ./gradlew :app:testDebugUnitTest --stacktrace
        test_report: app/build/test-results/**/*.xml

      - name: Verify committed Room schema
        script: git diff --exit-code -- app/schemas/

      - name: Android lint
        script: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug APK and performance harness
        script: ./gradlew :app:assembleDebug :benchmark:assembleBenchmarkBenchmark --stacktrace

      - name: Build release APK and AAB
        script: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify release Baseline Profile packaging
        script: python3 tools/verify_release_profile.py

      - name: Record release evidence
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          HEAD_SHA="$(git rev-parse HEAD)"
          printf 'verified_commit=%s\n' "$HEAD_SHA" > release-evidence.txt

          found=0
          for artifact in \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            app/src/*/generated/baselineProfiles/*.txt
          do
            [ -f "$artifact" ] || continue
            found=1
            hash="$(shasum -a 256 "$artifact" | awk '{print $1}')"
            bytes="$(stat -f%z "$artifact")"
            printf '%s sha256=%s bytes=%s\n' "$artifact" "$hash" "$bytes" >> release-evidence.txt
          done

          if [ "$found" -ne 1 ]; then
            echo "No release/profile artifacts found for evidence capture" >&2
            exit 1
          fi

          cat release-evidence.txt

    artifacts:
      - profile-generation.log
      - emulator-release-profile.log
      - release-evidence.txt
      - app/src/**/generated/baselineProfiles/*.txt
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - benchmark/build/outputs/**/*.apk
      - app/build/reports/**
      - app/build/test-results/**

