workflows:
  veil-reader-cloud-verify:
    name: Veil Reader Cloud Verify
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'upgrade/readium-3-4'
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      java: 17
    scripts:
      - name: Configure Android SDK and Gradle
        script: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"

          if [ ! -x "$CM_BUILD_DIR/gradlew" ]; then
            GRADLE_VERSION="9.6.0"
            GRADLE_HOME="$CM_BUILD_DIR/.gradle-dist/gradle-$GRADLE_VERSION"
            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
              mkdir -p "$CM_BUILD_DIR/.gradle-dist"
              curl --fail --location --retry 3 \
                "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" \
                --output "$CM_BUILD_DIR/.gradle-dist/gradle.zip"
              unzip -q "$CM_BUILD_DIR/.gradle-dist/gradle.zip" -d "$CM_BUILD_DIR/.gradle-dist"
            fi
            cat > "$CM_BUILD_DIR/gradlew" <<'EOF'
          #!/bin/sh
          exec "$CM_BUILD_DIR/.gradle-dist/gradle-9.6.0/bin/gradle" "$@"
          EOF
            chmod +x "$CM_BUILD_DIR/gradlew"
          fi

          cd "$CM_BUILD_DIR"
          ./gradlew --version

      - name: Policy and performance parser checks
        script: |
          sh tools/test-policy.sh
          python3 tools/test_performance_budget.py
          python3 tools/test_performance_delta.py
          python3 tools/test_performance_dashboard.py

      - name: Unit tests
        script: ./gradlew :app:testDebugUnitTest --stacktrace
        test_report: app/build/test-results/**/*.xml

      - name: Android lint
        script: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug and instrumentation APKs
        script: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Verify device-cloud test artifacts
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          APP_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*androidTest*.apk' | head -n 1)"
          test -f "$APP_APK"
          test -n "$TEST_APK"
          test -f "$TEST_APK"

          RUNNER_FOUND=0
          for DEX in $(unzip -Z1 "$TEST_APK" | grep '^classes.*\.dex$'); do
            if unzip -p "$TEST_APK" "$DEX" | strings | grep -q 'Landroidx/test/runner/AndroidJUnitRunner;'; then
              RUNNER_FOUND=1
              break
            fi
          done
          [ "$RUNNER_FOUND" -eq 1 ]

          echo "App APK: $APP_APK"
          echo "Test APK: $TEST_APK"
          echo "AndroidJUnitRunner packaged: yes"

      - name: Compile performance harness
        script: ./gradlew :benchmark:assembleBenchmarkBenchmark --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/apk/androidTest/**/*.apk
      - benchmark/build/outputs/**/*.apk
      - app/build/reports/**
      - app/build/test-results/**
      - app/build/outputs/androidTest-results/**

  veil-reader-device-verify:
    name: Veil Reader Device Verify — emulator.wtf
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      java: 17
    scripts:
      - name: Require emulator.wtf token
        script: |
          set -e
          if [ -z "${EW_API_TOKEN:-}" ]; then
            echo "EW_API_TOKEN is not configured in Codemagic Environment variables."
            echo "Create a free emulator.wtf Startup account, copy the API token, and save it as a Secret named EW_API_TOKEN."
            exit 2
          fi

      - name: Configure Android SDK and Gradle
        script: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          if [ ! -x "$CM_BUILD_DIR/gradlew" ]; then
            GRADLE_VERSION="9.6.0"
            GRADLE_HOME="$CM_BUILD_DIR/.gradle-dist/gradle-$GRADLE_VERSION"
            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
              mkdir -p "$CM_BUILD_DIR/.gradle-dist"
              curl --fail --location --retry 3 \
                "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" \
                --output "$CM_BUILD_DIR/.gradle-dist/gradle.zip"
              unzip -q "$CM_BUILD_DIR/.gradle-dist/gradle.zip" -d "$CM_BUILD_DIR/.gradle-dist"
            fi
            cat > "$CM_BUILD_DIR/gradlew" <<'EOF'
          #!/bin/sh
          exec "$CM_BUILD_DIR/.gradle-dist/gradle-9.6.0/bin/gradle" "$@"
          EOF
            chmod +x "$CM_BUILD_DIR/gradlew"
          fi

          cd "$CM_BUILD_DIR"
          ./gradlew --version

      - name: Build app and instrumentation APKs
        script: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Verify AndroidJUnitRunner
        script: |
          set -e
          TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*androidTest*.apk' | head -n 1)"
          test -n "$TEST_APK"
          RUNNER_FOUND=0
          for DEX in $(unzip -Z1 "$TEST_APK" | grep '^classes.*\.dex$'); do
            if unzip -p "$TEST_APK" "$DEX" | strings | grep -q 'Landroidx/test/runner/AndroidJUnitRunner;'; then
              RUNNER_FOUND=1
              break
            fi
          done
          [ "$RUNNER_FOUND" -eq 1 ]

      - name: Install emulator.wtf CLI
        script: |
          set -e
          mkdir -p "$HOME/bin"
          curl --fail --location --retry 3 https://maven.emulator.wtf/releases/ew-cli -o "$HOME/bin/ew-cli"
          chmod +x "$HOME/bin/ew-cli"
          "$HOME/bin/ew-cli" --version

      - name: Run Android instrumentation on Pixel 7 API 35
        script: |
          set -e
          APP_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*androidTest*.apk' | head -n 1)"
          mkdir -p emulator-wtf-results

          "$HOME/bin/ew-cli" \
            --app "$APP_APK" \
            --test "$TEST_APK" \
            --test-runner-class androidx.test.runner.AndroidJUnitRunner \
            --device model=Pixel7,version=35,gpu=auto \
            --timeout 15m \
            --record-video \
            --outputs-dir emulator-wtf-results
        test_report: emulator-wtf-results/**/*.xml

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/apk/androidTest/**/*.apk
      - emulator-wtf-results/**

ripwire-code-context-pilot:
    name: Ripwire Code Context Pilot
    instance_type: mac_mini_m2
    max_build_duration: 15
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'pilot/ripwire-code-context'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Capture grep baseline
        script: |
          set -euo pipefail
          mkdir -p ripwire-results
          START=$(python3 - <<'PY'
          import time
          print(time.perf_counter_ns())
          PY
          )
          git grep -n -I -E 'SQLiteException|Room|BookDao|VeilDatabase|readingProgress|reading progress|progress' -- app/src/main app/src/androidTest app/src/test > ripwire-results/grep-baseline.txt || true
          END=$(python3 - <<'PY'
          import time
          print(time.perf_counter_ns())
          PY
          )
          python3 - <<PY
          from pathlib import Path
          p=Path("ripwire-results/grep-baseline.txt")
          lines=p.read_text(errors="replace").splitlines() if p.exists() else []
          files=sorted({line.split(":",1)[0] for line in lines if ":" in line})
          elapsed_ms=(${END}-${START})/1_000_000
          Path("ripwire-results/grep-baseline-metrics.txt").write_text(
              f"elapsed_ms={elapsed_ms:.3f}\\noutput_bytes={p.stat().st_size if p.exists() else 0}\\nresult_lines={len(lines)}\\nunique_files={len(files)}\\n"
          )
          PY

      - name: Install pinned Ripwire
        script: |
          set -euo pipefail
          export RIPWIRE_REPO=redhat-et/ripwire
          export RIPWIRE_VERSION=v0.6.1
          export RIPWIRE_INSTALL_YES=1
          export RIPWIRE_NO_ACTIVATE=1
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/redhat-et/ripwire/v0.6.1/scripts/install.sh)"
          export PATH="$HOME/.local/bin:$PATH"
          ripwire --version | tee ripwire-results/ripwire-version.txt

      - name: Build Veil Reader map
        script: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          /usr/bin/time -p ripwire . > ripwire-results/repo-map.txt 2> ripwire-results/repo-map-time.txt
          wc -c ripwire-results/repo-map.txt > ripwire-results/repo-map-bytes.txt

      - name: Localize Room SQLite failure
        script: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          TASK="Diagnose an Android instrumentation failure involving android.database.sqlite.SQLiteException during rapid reading with Room persistence. Focus on BookDao, VeilDatabase, reading progress persistence, transaction/lifecycle boundaries, callers, dependencies, blast radius, and tests to run. Do not invent the root cause."
          /usr/bin/time -p ripwire . --for="$TASK" > ripwire-results/room-task.txt 2> ripwire-results/room-task-time.txt
          wc -c ripwire-results/room-task.txt > ripwire-results/room-task-bytes.txt

      - name: Database context probes
        script: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          {
            echo "=== BookDao ==="
            ripwire . --for="BookDao Room persistence reading progress"
            echo
            echo "=== VeilDatabase ==="
            ripwire . --for="VeilDatabase lifecycle SQLite instrumentation failure"
          } > ripwire-results/db-probes.txt

      - name: Pilot summary
        script: |
          set -euo pipefail
          {
            echo "RIPWIRE PILOT"
            cat ripwire-results/ripwire-version.txt
            echo
            echo "GREP BASELINE"
            cat ripwire-results/grep-baseline-metrics.txt
            echo
            echo "RIPWIRE MAP"
            cat ripwire-results/repo-map-time.txt
            cat ripwire-results/repo-map-bytes.txt
            echo
            echo "RIPWIRE ROOM TASK"
            cat ripwire-results/room-task-time.txt
            cat ripwire-results/room-task-bytes.txt
          } | tee ripwire-results/summary.txt

    artifacts:
      - ripwire-results/**
