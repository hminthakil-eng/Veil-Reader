workflows:
  veil-reader-release-hardening:
    name: Veil Reader Release Hardening — Cloud Pilot
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'ci/codemagic-release-pilot'
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      java: 17
    scripts:
      - name: Configure Android SDK and Gradle
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"

          if [ ! -x "$CM_BUILD_DIR/gradlew" ]; then
            GRADLE_VERSION="9.6.0"
            GRADLE_HOME="$CM_BUILD_DIR/.gradle-dist/gradle-$GRADLE_VERSION"
            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
              mkdir -p "$CM_BUILD_DIR/.gradle-dist"
              curl --fail --location --retry 3 \
                "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" \
                --output "$CM_BUILD_DIR/.gradle-dist/gradle.zip"
              unzip -q "$CM_BUILD_DIR/.gradle-dist/gradle.zip" -d "$CM_BUILD_DIR/.gradle-dist"
            fi
            cat > "$CM_BUILD_DIR/gradlew" <<'EOF'
          #!/bin/sh
          exec "$CM_BUILD_DIR/.gradle-dist/gradle-9.6.0/bin/gradle" "$@"
          EOF
            chmod +x "$CM_BUILD_DIR/gradlew"
          fi

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "platform-tools" \
            "emulator"

          ./gradlew --version

      - name: Policy and performance parser checks
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          sh tools/test-policy.sh
          python3 tools/test_performance_budget.py
          python3 tools/test_performance_delta.py
          python3 tools/test_performance_dashboard.py

      - name: Generate Baseline and Startup Profile on Gradle Managed Device
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          ./gradlew :app:generateBaselineProfile --stacktrace

          BASELINE="$(find app/src -type f -path '*/generated/baselineProfiles/baseline-prof.txt' -print -quit)"
          STARTUP="$(find app/src -type f -path '*/generated/baselineProfiles/startup-prof.txt' -print -quit)"

          test -n "$BASELINE"
          test -n "$STARTUP"
          test -s "$BASELINE"
          test -s "$STARTUP"

          echo "Generated Baseline Profile: $BASELINE ($(wc -c < "$BASELINE" | tr -d ' ') bytes)"
          echo "Generated Startup Profile: $STARTUP ($(wc -c < "$STARTUP" | tr -d ' ') bytes)"
          git status --short -- app/src

      - name: Unit tests
        script: ./gradlew :app:testDebugUnitTest --stacktrace
        test_report: app/build/test-results/**/*.xml

      - name: Verify committed Room schema
        script: git diff --exit-code -- app/schemas/

      - name: Android lint
        script: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug APK and performance harness
        script: ./gradlew :app:assembleDebug :benchmark:assembleBenchmarkBenchmark --stacktrace

      - name: Build release APK and AAB
        script: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify release Baseline Profile packaging
        script: python3 tools/verify_release_profile.py

      - name: Record release evidence
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          HEAD_SHA="$(git rev-parse HEAD)"
          printf 'verified_commit=%s\n' "$HEAD_SHA" > release-evidence.txt

          found=0
          for artifact in \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            app/src/*/generated/baselineProfiles/*.txt
          do
            [ -f "$artifact" ] || continue
            found=1
            hash="$(shasum -a 256 "$artifact" | awk '{print $1}')"
            bytes="$(stat -f%z "$artifact")"
            printf '%s sha256=%s bytes=%s\n' "$artifact" "$hash" "$bytes" >> release-evidence.txt
          done

          if [ "$found" -ne 1 ]; then
            echo "No release/profile artifacts found for evidence capture" >&2
            exit 1
          fi

          cat release-evidence.txt

    artifacts:
      - release-evidence.txt
      - app/src/**/generated/baselineProfiles/*.txt
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - benchmark/build/outputs/**/*.apk
      - app/build/reports/**
      - app/build/test-results/**

