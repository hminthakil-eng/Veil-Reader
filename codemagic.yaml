workflows:
  VEIL-APK:
    name: VEIL READER — APK BUILD
    instance_type: mac_mini_m2
    max_build_duration: 45

    # Manual-first on purpose: preserves the 500 free M2 minutes for useful runs.
    # Start this workflow from Codemagic and choose the branch you want to verify.
    environment:
      java: 21

    cache:
      cache_paths:
        - ~/.gradle/caches
        - $CM_BUILD_DIR/.gradle-dist

    scripts:
      - name: Configure Android SDK and Gradle
        script: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root is not available."
            exit 2
          fi

          echo "sdk.dir=$SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          if [ ! -x "$CM_BUILD_DIR/gradlew" ]; then
            GRADLE_VERSION="9.6.0"
            GRADLE_HOME="$CM_BUILD_DIR/.gradle-dist/gradle-$GRADLE_VERSION"

            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
              mkdir -p "$CM_BUILD_DIR/.gradle-dist"
              curl --fail --location --retry 3                 "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"                 --output "$CM_BUILD_DIR/.gradle-dist/gradle.zip"
              unzip -q -o "$CM_BUILD_DIR/.gradle-dist/gradle.zip" -d "$CM_BUILD_DIR/.gradle-dist"
            fi

            cat > "$CM_BUILD_DIR/gradlew" <<'EOF'
          #!/bin/sh
          exec "$CM_BUILD_DIR/.gradle-dist/gradle-9.6.0/bin/gradle" "$@"
          EOF
            chmod +x "$CM_BUILD_DIR/gradlew"
          fi

          cd "$CM_BUILD_DIR"
          ./gradlew --version

      - name: Policy and parser checks
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          sh tools/test-policy.sh
          python3 tools/test_performance_budget.py
          python3 tools/test_performance_delta.py
          python3 tools/test_performance_dashboard.py

      - name: Unit tests
        script: |
          set -o pipefail
          cd "$CM_BUILD_DIR"
          ./gradlew :app:testDebugUnitTest --stacktrace --console=plain --no-daemon 2>&1 | tee "$CM_BUILD_DIR/unit-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo
            echo "===== UNIT TEST ROOT-CAUSE SUMMARY ====="
            grep -E -i "^(e:|FAILURE:|\* What went wrong:|Execution failed for task|There were failing tests|.*FAILED.*|Caused by:)" "$CM_BUILD_DIR/unit-test.log" | tail -n 120 || true
            echo "===== END SUMMARY ====="
            exit "$status"
          fi
        test_report: app/build/test-results/**/*.xml

      - name: Android lint
        script: |
          set -o pipefail
          cd "$CM_BUILD_DIR"
          ./gradlew :app:lintDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$CM_BUILD_DIR/android-lint.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            report="$CM_BUILD_DIR/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            echo
            echo "===== ANDROID LINT FULL ERROR SUMMARY ====="
            if [ -f "$report" ]; then
              grep -n -E "Error:|^[^ ].*:[0-9]+: Error:" "$report" || cat "$report"
            else
              grep -E -i "Error:|Lint found|FAILURE:|Execution failed for task" "$CM_BUILD_DIR/android-lint.log" | tail -n 240 || true
            fi
            echo "===== END LINT SUMMARY ====="
            exit "$status"
          fi

      - name: Assemble debug APK
        script: |
          cd "$CM_BUILD_DIR"
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

    artifacts:
      - unit-test.log
      - android-lint.log
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/**
      - app/build/test-results/**

  VEIL-FINAL-VERIFY:
    name: VEIL READER — FINAL VERIFY + APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Manual-only heavy lane: use after Fast Verify is green.
    environment:
      java: 21

    cache:
      cache_paths:
        - ~/.gradle/caches
        - $CM_BUILD_DIR/.gradle-dist

    scripts:
      - name: Configure Android SDK and Gradle
        script: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root is not available."
            exit 2
          fi

          echo "sdk.dir=$SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"

          if [ ! -x "$CM_BUILD_DIR/gradlew" ]; then
            GRADLE_VERSION="9.6.0"
            GRADLE_HOME="$CM_BUILD_DIR/.gradle-dist/gradle-$GRADLE_VERSION"

            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
              mkdir -p "$CM_BUILD_DIR/.gradle-dist"
              curl --fail --location --retry 3                 "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"                 --output "$CM_BUILD_DIR/.gradle-dist/gradle.zip"
              unzip -q -o "$CM_BUILD_DIR/.gradle-dist/gradle.zip" -d "$CM_BUILD_DIR/.gradle-dist"
            fi

            cat > "$CM_BUILD_DIR/gradlew" <<'EOF'
          #!/bin/sh
          exec "$CM_BUILD_DIR/.gradle-dist/gradle-9.6.0/bin/gradle" "$@"
          EOF
            chmod +x "$CM_BUILD_DIR/gradlew"
          fi

          cd "$CM_BUILD_DIR"
          ./gradlew --version

      - name: Policy and parser checks
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          sh tools/test-policy.sh
          python3 tools/test_performance_budget.py
          python3 tools/test_performance_delta.py
          python3 tools/test_performance_dashboard.py

      - name: Unit tests and lint
        script: |
          set -o pipefail
          cd "$CM_BUILD_DIR"
          ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$CM_BUILD_DIR/full-verify.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo
            echo "===== FULL VERIFY ROOT-CAUSE SUMMARY ====="
            grep -E -i "^(e:|FAILURE:|\* What went wrong:|Execution failed for task|There were failing tests|.*FAILED.*|Caused by:)" "$CM_BUILD_DIR/full-verify.log" | tail -n 160 || true
            lint_report="$CM_BUILD_DIR/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$lint_report" ]; then
              echo
              echo "===== FULL LINT ERRORS ====="
              grep -n -E "Error:|^[^ ].*:[0-9]+: Error:" "$lint_report" || cat "$lint_report"
              echo "===== END FULL LINT ERRORS ====="
            fi
            echo "===== END SUMMARY ====="
            exit "$status"
          fi
        test_report: app/build/test-results/**/*.xml

      - name: Build app and instrumentation APKs
        script: |
          cd "$CM_BUILD_DIR"
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Verify AndroidJUnitRunner packaging
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          APP_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*androidTest*.apk' -print -quit)"

          test -f "$APP_APK"
          test -n "$TEST_APK"
          test -f "$TEST_APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"

          AAPT=""
          for candidate in "$SDK_ROOT"/build-tools/*/aapt; do
            if [ -x "$candidate" ]; then
              AAPT="$candidate"
            fi
          done

          if [ -z "$AAPT" ]; then
            echo "Android build-tools aapt was not found under $SDK_ROOT/build-tools."
            exit 1
          fi

          echo "Using manifest inspector: $AAPT"
          MANIFEST_XML="$("$AAPT" dump xmltree "$TEST_APK" AndroidManifest.xml)"

          case "$MANIFEST_XML" in
            *"androidx.test.runner.AndroidJUnitRunner"*)
              ;;
            *)
              echo "AndroidJUnitRunner is not declared in the instrumentation APK manifest."
              exit 1
              ;;
          esac

          case "$MANIFEST_XML" in
            *"com.veilreader.app"*)
              ;;
            *)
              echo "Veil Reader target package is not declared in the instrumentation APK manifest."
              exit 1
              ;;
          esac

          echo "AndroidJUnitRunner manifest registration: yes"
          echo "Instrumentation APK: $TEST_APK"

      - name: Compile performance harness
        script: |
          cd "$CM_BUILD_DIR"
          ./gradlew :benchmark:assembleBenchmarkBenchmark --stacktrace --no-daemon

    artifacts:
      - full-verify.log
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/apk/androidTest/**/*.apk
      - benchmark/build/outputs/**/*.apk
      - app/build/reports/**
      - app/build/test-results/**
      - app/build/outputs/androidTest-results/**
