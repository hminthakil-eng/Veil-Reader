workflows:
  UIUX-CANONICAL-DEBUG-APK:
    name: 01 — UIUX CANONICAL — DEBUG APK + TEST + LINT
    instance_type: mac_mini_m2
    max_build_duration: 45

    # PRIMARY UI/UX CANONICAL BUILD.
    # In Codemagic choose branch: CANONICAL-UIUX-PERFECTION.
    environment:
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - $CM_BUILD_DIR/.gradle-dist

    scripts:
      - name: Configure Android SDK and Gradle
        script: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root is not available."
            exit 2
          fi

          echo "sdk.dir=$SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          if [ ! -x "$CM_BUILD_DIR/gradlew" ]; then
            GRADLE_VERSION="9.6.0"
            GRADLE_HOME="$CM_BUILD_DIR/.gradle-dist/gradle-$GRADLE_VERSION"

            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
              mkdir -p "$CM_BUILD_DIR/.gradle-dist"
              curl --fail --location --retry 3                 "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"                 --output "$CM_BUILD_DIR/.gradle-dist/gradle.zip"
              unzip -q -o "$CM_BUILD_DIR/.gradle-dist/gradle.zip" -d "$CM_BUILD_DIR/.gradle-dist"
            fi

            cat > "$CM_BUILD_DIR/gradlew" <<'EOF'
          #!/bin/sh
          exec "$CM_BUILD_DIR/.gradle-dist/gradle-9.6.0/bin/gradle" "$@"
          EOF
            chmod +x "$CM_BUILD_DIR/gradlew"
          fi

          cd "$CM_BUILD_DIR"
          ./gradlew --version

      - name: Policy and parser checks
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          sh tools/test-policy.sh
          python3 tools/test_performance_budget.py
          python3 tools/test_performance_delta.py
          python3 tools/test_performance_dashboard.py

      - name: Unit tests
        script: |
          set -o pipefail
          cd "$CM_BUILD_DIR"
          ./gradlew :app:testDebugUnitTest --stacktrace --console=plain --no-daemon 2>&1 | tee "$CM_BUILD_DIR/unit-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo
            echo "===== UNIT TEST ROOT-CAUSE SUMMARY ====="
            grep -E -i "^(e:|FAILURE:|\* What went wrong:|Execution failed for task|There were failing tests|.*FAILED.*|Caused by:)" "$CM_BUILD_DIR/unit-test.log" | tail -n 120 || true
            echo "===== END SUMMARY ====="
            exit "$status"
          fi
        test_report: app/build/test-results/**/*.xml

      - name: Android lint
        script: |
          cd "$CM_BUILD_DIR"
          ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Assemble debug APK
        script: |
          cd "$CM_BUILD_DIR"
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

    artifacts:
      - unit-test.log
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/**
      - app/build/test-results/**

  UIUX-CANONICAL-FULL-VERIFY:
    name: 02 — UIUX CANONICAL — FULL VERIFY + TEST APK + BENCHMARK
    instance_type: mac_mini_m2
    max_build_duration: 60

    # HEAVY UI/UX CANONICAL VERIFY. Run only after workflow 01 is green.
    environment:
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - $CM_BUILD_DIR/.gradle-dist

    scripts:
      - name: Configure Android SDK and Gradle
        script: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root is not available."
            exit 2
          fi

          echo "sdk.dir=$SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"

          if [ ! -x "$CM_BUILD_DIR/gradlew" ]; then
            GRADLE_VERSION="9.6.0"
            GRADLE_HOME="$CM_BUILD_DIR/.gradle-dist/gradle-$GRADLE_VERSION"

            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
              mkdir -p "$CM_BUILD_DIR/.gradle-dist"
              curl --fail --location --retry 3                 "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"                 --output "$CM_BUILD_DIR/.gradle-dist/gradle.zip"
              unzip -q -o "$CM_BUILD_DIR/.gradle-dist/gradle.zip" -d "$CM_BUILD_DIR/.gradle-dist"
            fi

            cat > "$CM_BUILD_DIR/gradlew" <<'EOF'
          #!/bin/sh
          exec "$CM_BUILD_DIR/.gradle-dist/gradle-9.6.0/bin/gradle" "$@"
          EOF
            chmod +x "$CM_BUILD_DIR/gradlew"
          fi

          cd "$CM_BUILD_DIR"
          ./gradlew --version

      - name: Policy and parser checks
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          sh tools/test-policy.sh
          python3 tools/test_performance_budget.py
          python3 tools/test_performance_delta.py
          python3 tools/test_performance_dashboard.py

      - name: Unit tests and lint
        script: |
          set -o pipefail
          cd "$CM_BUILD_DIR"
          ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$CM_BUILD_DIR/full-verify.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo
            echo "===== FULL VERIFY ROOT-CAUSE SUMMARY ====="
            grep -E -i "^(e:|FAILURE:|\* What went wrong:|Execution failed for task|There were failing tests|.*FAILED.*|Caused by:)" "$CM_BUILD_DIR/full-verify.log" | tail -n 160 || true
            echo "===== END SUMMARY ====="
            exit "$status"
          fi
        test_report: app/build/test-results/**/*.xml

      - name: Build app and instrumentation APKs
        script: |
          cd "$CM_BUILD_DIR"
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Verify AndroidJUnitRunner packaging
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          APP_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*androidTest*.apk' | head -n 1)"

          test -f "$APP_APK"
          test -n "$TEST_APK"
          test -f "$TEST_APK"

          echo "App APK: $APP_APK"
          echo "Test APK: $TEST_APK"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          # Avoid unzip|strings|grep -q under pipefail. grep -q may terminate early after a
          # successful match, causing upstream SIGPIPE and a false-negative pipeline status.
          RUNNER_FOUND=0
          DEX_LIST="$TMP_DIR/dex-list.txt"
          unzip -Z1 "$TEST_APK" | grep '^classes.*\.dex

      - name: Compile performance harness
        script: |
          cd "$CM_BUILD_DIR"
          ./gradlew :benchmark:assembleBenchmarkBenchmark --stacktrace --no-daemon

    artifacts:
      - full-verify.log
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/apk/androidTest/**/*.apk
      - benchmark/build/outputs/**/*.apk
      - app/build/reports/**
      - app/build/test-results/**
      - app/build/outputs/androidTest-results/**
 > "$DEX_LIST"

          while IFS= read -r DEX; do
            [ -n "$DEX" ] || continue
            DEX_FILE="$TMP_DIR/$(basename "$DEX")"
            STRINGS_FILE="$DEX_FILE.strings"
            unzip -p "$TEST_APK" "$DEX" > "$DEX_FILE"
            strings "$DEX_FILE" > "$STRINGS_FILE"

            if grep -Fq 'Landroidx/test/runner/AndroidJUnitRunner;' "$STRINGS_FILE" ||
               grep -Fq 'androidx/test/runner/AndroidJUnitRunner' "$STRINGS_FILE" ||
               grep -Fq 'androidx.test.runner.AndroidJUnitRunner' "$STRINGS_FILE"; then
              echo "AndroidJUnitRunner dex evidence: $DEX"
              RUNNER_FOUND=1
              break
            fi
          done < "$DEX_LIST"

          if [ "$RUNNER_FOUND" -ne 1 ]; then
            echo "AndroidJUnitRunner class was not found in test APK dex files."
            echo "DEX entries:"
            cat "$DEX_LIST"
            echo "Instrumentation manifest evidence:"
            if command -v apkanalyzer >/dev/null 2>&1; then
              apkanalyzer manifest print "$TEST_APK" | grep -n -E 'instrumentation|AndroidJUnitRunner' || true
            fi
            exit 1
          fi

          if command -v apkanalyzer >/dev/null 2>&1; then
            MANIFEST_DUMP="$TMP_DIR/manifest.xml"
            apkanalyzer manifest print "$TEST_APK" > "$MANIFEST_DUMP"
            if ! grep -Fq 'androidx.test.runner.AndroidJUnitRunner' "$MANIFEST_DUMP"; then
              echo "Runner class exists, but instrumentation manifest does not name AndroidJUnitRunner."
              grep -n -E 'instrumentation|runner' "$MANIFEST_DUMP" || true
              exit 1
            fi
            echo "AndroidJUnitRunner manifest evidence: yes"
          fi

          echo "AndroidJUnitRunner packaged: yes"

      - name: Compile performance harness
        script: |
          cd "$CM_BUILD_DIR"
          ./gradlew :benchmark:assembleBenchmarkBenchmark --stacktrace --no-daemon

    artifacts:
      - full-verify.log
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/apk/androidTest/**/*.apk
      - benchmark/build/outputs/**/*.apk
      - app/build/reports/**
      - app/build/test-results/**
      - app/build/outputs/androidTest-results/**
