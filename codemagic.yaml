workflows:
  veil-reader-cloud-verify:
    name: Veil Reader Cloud Verify
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'upgrade/readium-3-4'
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      java: 17
    scripts:
      - name: Configure Android SDK and Gradle
        script: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"

          # This repository currently has no checked-in Gradle wrapper.
          # AGP 9.4.0 requires Gradle 9.6.0, so bootstrap that exact version
          # for cloud verification rather than relying on the worker default.
          if [ ! -x "$CM_BUILD_DIR/gradlew" ]; then
            GRADLE_VERSION="9.6.0"
            GRADLE_HOME="$CM_BUILD_DIR/.gradle-dist/gradle-$GRADLE_VERSION"
            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
              mkdir -p "$CM_BUILD_DIR/.gradle-dist"
              curl --fail --location --retry 3 \
                "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" \
                --output "$CM_BUILD_DIR/.gradle-dist/gradle.zip"
              unzip -q "$CM_BUILD_DIR/.gradle-dist/gradle.zip" -d "$CM_BUILD_DIR/.gradle-dist"
            fi
            cat > "$CM_BUILD_DIR/gradlew" <<'EOF'
          #!/bin/sh
          exec "$CM_BUILD_DIR/.gradle-dist/gradle-9.6.0/bin/gradle" "$@"
          EOF
            chmod +x "$CM_BUILD_DIR/gradlew"
          fi

          cd "$CM_BUILD_DIR"
          ./gradlew --version

      - name: Policy and performance parser checks
        script: |
          sh tools/test-policy.sh
          python3 tools/test_performance_budget.py
          python3 tools/test_performance_delta.py
          python3 tools/test_performance_dashboard.py

      - name: Unit tests
        script: ./gradlew :app:testDebugUnitTest --stacktrace
        test_report: app/build/test-results/**/*.xml

      - name: Android lint
        script: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug and instrumentation APKs
        script: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Run Android instrumentation tests
        script: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"

          AVD_NAME="$(emulator -list-avds | head -n 1 || true)"
          if [ -z "$AVD_NAME" ]; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager \
              "platform-tools" \
              "emulator" \
              "platforms;android-35" \
              "system-images;android-35;google_apis;arm64-v8a"
            echo "no" | avdmanager create avd \
              --force \
              --name veil_ci \
              --package "system-images;android-35;google_apis;arm64-v8a" \
              --device "pixel_6"
            AVD_NAME="veil_ci"
          fi

          emulator \
            -avd "$AVD_NAME" \
            -no-window \
            -no-audio \
            -no-snapshot \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > "$CM_BUILD_DIR/emulator.log" 2>&1 &

          adb wait-for-device
          BOOT_COMPLETED=""
          for _ in $(seq 1 180); do
            BOOT_COMPLETED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$BOOT_COMPLETED" = "1" ] && break
            sleep 2
          done
          [ "$BOOT_COMPLETED" = "1" ]

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          ./gradlew :app:connectedDebugAndroidTest --stacktrace
          adb logcat -d > "$CM_BUILD_DIR/android-logcat.txt" || true
        test_report: app/build/outputs/androidTest-results/connected/**/*.xml

      - name: Compile performance harness
        script: ./gradlew :benchmark:assembleBenchmarkBenchmark --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/apk/androidTest/**/*.apk
      - benchmark/build/outputs/**/*.apk
      - app/build/reports/**
      - app/build/test-results/**
      - app/build/outputs/androidTest-results/**
      - emulator.log
      - android-logcat.txt
