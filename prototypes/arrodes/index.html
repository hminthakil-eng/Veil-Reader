<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Arrodes — Standalone Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage" aria-labelledby="title">
    <header class="topbar">
      <div>
        <p class="eyebrow">Veil Reader · isolated prototype</p>
        <h1 id="title">Arrodes</h1>
      </div>
      <button id="replay" class="ghost-button" type="button">Summon another fragment</button>
    </header>

    <section class="mirror-wrap" aria-label="Arrodes memory mirror">
      <div class="orbit orbit-a" aria-hidden="true"></div>
      <div class="orbit orbit-b" aria-hidden="true"></div>

      <div id="mirror" class="mirror" data-state="idle" role="button" tabindex="0" aria-describedby="hint">
        <div class="crest crest-top" aria-hidden="true"><span></span></div>
        <div class="eye eye-left" aria-hidden="true"><span></span></div>
        <div class="eye eye-right" aria-hidden="true"><span></span></div>
        <div class="crest crest-bottom" aria-hidden="true"><span></span></div>

        <div class="frame-ring frame-ring-outer" aria-hidden="true"></div>
        <div class="frame-ring frame-ring-inner" aria-hidden="true"></div>

        <div class="glass">
          <canvas id="ashCanvas" aria-hidden="true"></canvas>
          <div class="nebula" aria-hidden="true"></div>
          <div class="shimmer" aria-hidden="true"></div>

          <article id="quoteCard" class="quote-card" aria-live="polite">
            <blockquote id="quote"></blockquote>
            <footer>
              <span id="book"></span>
              <span class="dot">·</span>
              <span id="location"></span>
            </footer>
          </article>
        </div>
      </div>

      <div class="pedestal" aria-hidden="true">
        <div class="sigil"></div>
      </div>
    </section>

    <footer class="meta-row">
      <p id="hint">Tap the mirror to reveal another saved fragment.</p>
      <p class="state-readout">State: <span id="stateLabel">Idle</span></p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
