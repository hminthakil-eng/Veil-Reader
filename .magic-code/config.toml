# Veil Reader project policy for magic-code.
# Provider/model/API credentials stay in the user's local/global config, never in Git.
[default]
permission_mode = "workspace-write"

[context]
instruction_files = [".magic-code/instructions.md"]
ignore_patterns = [
  ".git/**",
  ".gradle/**",
  "**/build/**",
  "**/.idea/**",
  "**/*.apk",
  "**/*.aab"
]

[managed_agents]
enabled = false
