schema_version: 1
project: Veil Reader
owner: Eyad Studio
platform:
  type: native_android
  language: Kotlin
  ui: Jetpack Compose
  design_system: Material 3

design_intelligence:
  provider: ui-ux-pro-max
  source: nextlevelbuilder/ui-ux-pro-max-skill
  pinned_commit: 15de38fb70bc80ae9276fa7703b48ae861a672e6
  stack: jetpack-compose
  policy: pinned_reviewed_reference

pattern_sources:
  - name: 21st.dev
    mode: visual_pattern_reference_only
    rule: never_copy_react_code_into_android_runtime
    adaptation_target: Jetpack Compose

quality_gates:
  - accessibility
  - touch_targets
  - dark_light_contrast
  - adaptive_layout
  - rtl_readiness
  - reduced_motion
  - typography_readability
  - reader_focus

implementation_rules:
  - preserve_existing_veil_identity
  - native_compose_only
  - no_web_runtime_dependency
  - reuse_before_rebuild
  - validate_against_design-system/veil-reader/MASTER.md

apple_principles_review:
  status: source_pinned_project_adapter
  project_skill: .claude/skills/veil-apple-design-audit/SKILL.md
  references:
    - source: dickwu/apple-design-skill
      pinned_commit: 904b0eedc7cc778152f545506075d5bb5219ce77
      mode: design_review_reference_only
    - source: Elevatormusic/apple-hig
      pinned_commit: e00f1af16c71f4122e7c964563d2f563fd490d7e
      mode: design_review_reference_only
  target_platform: native_android_jetpack_compose
  rule: android_platform_and_veil_tokens_take_precedence
  binary_assets: never_copy_apple_fonts_symbols_or_templates
  regression_gate: python3 tools/check_veil_ui_contrast.py
